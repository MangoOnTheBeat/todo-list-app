<!doctype html>
<html lang="en" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Lumora OS — a concept smart-TV interface. Not affiliated with any TV platform or streaming service.">
<title>Lumora OS</title>
<style>
/* =========================================================================
   Lumora OS — concept TV interface. Layout is drawn on a 120rem x 67.5rem
   canvas, so it scales identically at 720p, 1080p and 4K.
   Only transform and opacity are ever animated.
   ========================================================================= */
:root{
  --spring:cubic-bezier(.3,1.35,.55,1);
  --spring-soft:cubic-bezier(.25,1.1,.4,1);
  --out:cubic-bezier(.16,1,.3,1);
  --ts:1;
  --blur:2rem;
  --font:system-ui,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --accent:#8b9cff; --accent2:#4fe3c1;
}
@supports (transition-timing-function:linear(0,1)){
  :root{
    --spring:linear(0,.0459,.1556,.2958,.4431,.5823,.7046,.806,.8857,.9451,.9868,1.0139,1.0296,1.0369,1.0383,1.0359,1.0314,1.0259,1.0203,1.015,1.0105,1.0068,1.0039,1.0017,1.0003,.9993,.9988,.9986,.9985,.9986,.9988,.999,1);
    --spring-soft:linear(0,.063,.1991,.3555,.5042,.6324,.7361,.8163,.8761,.9191,.9491,.9695,.9828,.9912,.9963,.9992,1.0007,1.0014,1.0015,1.0014,1.0012,1.001,1.0008,1.0006,1);
  }
}
.theme-dark{
  --bg:#06070b; --fg:#f3f5fa; --fg2:rgba(243,245,250,.66); --fg3:rgba(243,245,250,.42);
  --glass:rgba(30,33,46,.46); --glass-solid:#1a1d27; --glass-strong:rgba(20,22,31,.78);
  --chip:rgba(255,255,255,.09); --chip-sel:rgba(255,255,255,.18); --stroke:rgba(255,255,255,.11);
  --focus-bg:#f3f5fa; --focus-fg:#0a0c12; --shadow:rgba(0,0,0,.6);
  --veil:#04060c; --veil-home:.12; --veil-app:.62; --scrim-top:rgba(0,0,0,.35); --scrim-bot:rgba(0,0,0,.62);
}
.theme-light{
  --bg:#e8ecf4; --fg:#0d111c; --fg2:rgba(13,17,28,.66); --fg3:rgba(13,17,28,.45);
  --glass:rgba(255,255,255,.52); --glass-solid:#f4f6fa; --glass-strong:rgba(250,251,253,.86);
  --chip:rgba(13,17,28,.07); --chip-sel:rgba(13,17,28,.14); --stroke:rgba(13,17,28,.1);
  --focus-bg:#0d111c; --focus-fg:#ffffff; --shadow:rgba(20,30,60,.35);
  --veil:#eef1f7; --veil-home:.5; --veil-app:.78; --scrim-top:rgba(255,255,255,.3); --scrim-bot:rgba(255,255,255,.5);
}
.hc.theme-dark{--fg2:#fff;--fg3:#e6e6e6;--glass:#000;--glass-strong:#000;--glass-solid:#000;--chip:#1c1c1c;--chip-sel:#3a3a3a;--stroke:#fff;--veil-app:.92;--veil-home:.45}
.hc.theme-light{--fg2:#000;--fg3:#1a1a1a;--glass:#fff;--glass-strong:#fff;--glass-solid:#fff;--chip:#e2e2e2;--chip-sel:#c4c4c4;--stroke:#000;--veil-app:.95;--veil-home:.7}

*{box-sizing:border-box}
html{font-size:max(7px,min(calc(100vw / 120),calc(100vh / 67.5)));height:100%;background:var(--bg)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  font-size:calc(1.5rem * var(--ts));line-height:1.35}
.kbd body,.kbd *{cursor:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
[data-f]{outline:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- wallpaper ---------- */
#wall{position:fixed;inset:0;overflow:hidden;z-index:0}
#wall-inner{position:absolute;inset:-5%;transition:transform 1s var(--spring-soft)}
.wp{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 1.2s ease}
.wp.on{opacity:1}
.wp i{position:absolute;display:block;will-change:transform}
.wp-aurora{background:radial-gradient(140% 100% at 50% 120%,#101848 0%,#070914 55%,#04050a 100%)}
.wp-aurora .b1{width:80vmax;height:80vmax;left:-20vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(96,112,255,.75),rgba(96,112,255,0));animation:dr1 34s ease-in-out infinite alternate}
.wp-aurora .b2{width:70vmax;height:70vmax;right:-20vmax;top:-10vmax;background:radial-gradient(closest-side,rgba(40,220,190,.55),rgba(40,220,190,0));animation:dr2 41s ease-in-out infinite alternate}
.wp-aurora .b3{width:75vmax;height:75vmax;left:20vmax;bottom:-45vmax;background:radial-gradient(closest-side,rgba(220,80,200,.45),rgba(220,80,200,0));animation:dr3 47s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate3d(28vw,16vh,0) scale(1.25)}}
@keyframes dr2{to{transform:translate3d(-30vw,22vh,0) scale(.85)}}
@keyframes dr3{to{transform:translate3d(-18vw,-20vh,0) scale(1.15)}}
.wp-nebula{background:radial-gradient(90% 70% at 70% 30%,#2a1350 0%,#120a2a 45%,#05040c 100%)}
.wp-nebula .cloud{inset:-10%;background:radial-gradient(40% 30% at 30% 65%,rgba(255,90,170,.28),transparent 70%),radial-gradient(35% 28% at 72% 35%,rgba(90,140,255,.32),transparent 70%);animation:neb 60s ease-in-out infinite alternate}
.wp-nebula .s1,.wp-nebula .s2{width:2px;height:2px;border-radius:50%;left:0;top:0;background:transparent}
.wp-nebula .s1{animation:twk 5s ease-in-out infinite alternate}
.wp-nebula .s2{animation:twk 7s ease-in-out -3s infinite alternate}
.wp-nebula .rot{inset:-30%;animation:spin 400s linear infinite}
@keyframes neb{to{transform:scale(1.12) translate3d(-3vw,2vh,0)}}
@keyframes twk{from{opacity:.25}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.wp-tide{background:linear-gradient(180deg,#0d2c4a 0%,#145a74 45%,#0a3346 70%,#061a26 100%)}
.wp-tide .sun{width:40vmax;height:40vmax;left:50%;top:8%;margin-left:-20vmax;background:radial-gradient(closest-side,rgba(255,214,150,.55),rgba(255,214,150,0));animation:sun 20s ease-in-out infinite alternate}
.wp-tide .w{left:0;width:200%;height:40%;bottom:0;background-repeat:repeat-x;background-size:50% 100%}
.wp-tide .w1{bottom:14%;opacity:.35;animation:wave 38s linear infinite}
.wp-tide .w2{bottom:6%;opacity:.5;animation:wave 26s linear infinite}
.wp-tide .w3{bottom:-4%;opacity:.8;animation:wave 18s linear infinite}
@keyframes wave{to{transform:translate3d(-50%,0,0)}}
@keyframes sun{to{transform:translate3d(0,3vh,0) scale(1.08)}}
.wp-still{background-size:cover;background-position:center}
.reduce-motion .wp *,.lite .wp *,.ambient-paused .wp *{animation-play-state:paused!important}

#veil{position:fixed;inset:0;z-index:1;background:var(--veil);opacity:var(--veil-home);transition:opacity .5s ease;pointer-events:none}
.on-app #veil{opacity:var(--veil-app)}
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,var(--scrim-top) 0%,transparent 28%,transparent 50%,var(--scrim-bot) 100%);transition:opacity .5s}
.on-app #scrim{opacity:0}

/* ---------- glass ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border:1px solid var(--stroke)}
.glass-strong{background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);border:1px solid var(--stroke)}
.lite .glass,.lite .glass-strong,.no-transp .glass,.no-transp .glass-strong,.hc .glass,.hc .glass-strong{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-solid)}

/* ---------- screens ---------- */
#screens{position:fixed;inset:0;z-index:2}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(1.035);
  transition:opacity .32s ease,transform .6s var(--spring-soft),visibility 0s linear .6s}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .32s ease,transform .6s var(--spring-soft),visibility 0s}
.screen.behind{transform:scale(.965)}
.reduce-motion .screen{transform:none!important}

/* ---------- generic focusables (.fx) ---------- */
.fx{position:relative;isolation:isolate;transition:transform .42s var(--spring)}
.fx::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--chip);z-index:-2}
.fx::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--focus-bg);opacity:0;z-index:-1;transition:opacity .16s ease;box-shadow:0 1.2rem 2.6rem var(--shadow)}
.fx.focused{color:var(--focus-fg);transform:scale(1.045)}
.fx.focused::after{opacity:1}
.fx.plain::before{background:transparent}
.fx.sel:not(.focused)::before{background:var(--chip-sel)}
.reduce-motion .fx.focused{transform:none}
.hc .fx.focused::after{box-shadow:0 0 0 .3rem var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.8rem;min-height:4.6rem;padding:0 2.4rem;border-radius:2.3rem;font-size:calc(1.45rem * var(--ts));font-weight:600;white-space:nowrap}
.btn.primary::before{background:var(--chip-sel)}
.btn .i{font-size:1.5em}
.icon-btn{width:4.6rem;height:4.6rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:2rem}
.icon-btn .i{font-size:2.1rem}
[aria-disabled="true"]{opacity:.38}

/* bump when hitting an edge */
.bump-left{animation:bl .32s var(--out)}.bump-right{animation:br .32s var(--out)}
.bump-up{animation:bu .32s var(--out)}.bump-down{animation:bd .32s var(--out)}
@keyframes bl{30%{translate:-.6rem 0}}@keyframes br{30%{translate:.6rem 0}}
@keyframes bu{30%{translate:0 -.6rem}}@keyframes bd{30%{translate:0 .6rem}}
.reduce-motion [class*="bump-"]{animation:none}

/* ---------- tiles ---------- */
.tile{position:relative;flex:0 0 auto;width:var(--tw,17.5rem);--px:0;--py:0;--s:1;--ly:0rem}
.t-lift{position:relative;transform:perspective(60rem) translate3d(0,var(--ly),0) scale(var(--s)) rotateX(calc(var(--py) * -14deg)) rotateY(calc(var(--px) * 16deg));
  transition:transform .55s var(--spring);will-change:transform}
.tile.focused{--s:1.11;--ly:-.5rem;z-index:3}
.tile.tracking .t-lift{transition:transform .14s linear}
.t-shadow{position:absolute;inset:6% 4% 0;border-radius:1.6rem;box-shadow:0 2.2rem 3.4rem var(--shadow);opacity:0;transition:opacity .3s ease}
.tile.focused .t-shadow{opacity:1}
.t-card{position:relative;aspect-ratio:var(--ar,5/3);border-radius:1.5rem;overflow:hidden;isolation:isolate;
  background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 .6rem 1.4rem rgba(0,0,0,.28);transform:translateZ(0)}
.t-art{position:absolute;inset:-6%;transform:translate3d(calc(var(--px) * -1.2rem),calc(var(--py) * -1.2rem),0);transition:transform .55s var(--spring)}
.t-art::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 20% 0%,rgba(255,255,255,.22),transparent 60%),radial-gradient(70% 60% at 100% 100%,rgba(0,0,0,.35),transparent 70%)}
.t-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t-name{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:1rem 1.2rem;text-align:center;color:#fff;
  font-weight:700;font-size:calc(1.95rem * var(--ts));letter-spacing:-.01em;line-height:1.1;text-shadow:0 .2rem .8rem rgba(0,0,0,.35);
  transform:translate3d(calc(var(--px) * 1rem),calc(var(--py) * 1rem),0);transition:transform .55s var(--spring)}
.t-name.long{font-size:calc(1.55rem * var(--ts))}
.t-name .i{font-size:4.2rem;stroke-width:1.6}
.t-name small{font-size:calc(1.2rem * var(--ts));font-weight:600;opacity:.92}
.t-spec{position:absolute;inset:-50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);opacity:0;
  transform:translate3d(calc(var(--px) * 40%),calc(var(--py) * 40%),0);transition:opacity .3s,transform .55s var(--spring)}
.tile.focused .t-spec{opacity:.7}
.t-glint{position:absolute;top:-20%;bottom:-20%;left:0;width:60%;background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 70%,transparent 100%);
  transform:translate3d(-120%,0,0) skewX(-12deg);opacity:0;pointer-events:none}
.tile.focused .t-glint{animation:glint 1s var(--out) .06s 1 both}
@keyframes glint{0%{transform:translate3d(-120%,0,0) skewX(-12deg);opacity:1}100%{transform:translate3d(260%,0,0) skewX(-12deg);opacity:1}}
.t-ring{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .22rem rgba(255,255,255,.75);opacity:0;transition:opacity .2s}
.tile.focused .t-ring{opacity:1}
.hc .tile.focused .t-ring{box-shadow:inset 0 0 0 .4rem #fff,0 0 0 .3rem #000}
.t-title{margin-top:1rem;text-align:center;font-size:calc(1.3rem * var(--ts));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translate3d(0,-.4rem,0);transition:opacity .2s,transform .4s var(--spring)}
.tile.focused .t-title,.tile.show-title .t-title{opacity:1;transform:translate3d(0,.3rem,0)}
.t-sub{display:block;font-weight:500;color:var(--fg2);font-size:calc(1.1rem * var(--ts));overflow:hidden;text-overflow:ellipsis}
.t-badge{position:absolute;top:.8rem;right:.8rem;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.92);color:#0a0c12;display:flex;align-items:center;justify-content:center;font-size:1.4rem;z-index:2}
.t-badge .i{stroke-width:3}
.t-lock{position:absolute;top:.8rem;left:.8rem;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;z-index:2}
.t-prog{position:absolute;left:1rem;right:1rem;bottom:1rem;height:.5rem;border-radius:.3rem;background:rgba(0,0,0,.35);overflow:hidden;z-index:2}
.t-prog b{position:absolute;inset:0;background:#fff;transform-origin:0 50%;transform:scaleX(0);transition:transform .12s linear}
.tile.moving .t-lift{animation:jiggle .28s ease-in-out infinite alternate}
.tile.moving{--s:1.14}
@keyframes jiggle{from{transform:perspective(60rem) translate3d(0,-.5rem,0) scale(1.14) rotate(-1.4deg)}to{transform:perspective(60rem) translate3d(0,-.5rem,0) scale(1.14) rotate(1.4deg)}}
.reduce-motion .tile{--px:0!important;--py:0!important}
.reduce-motion .tile.focused{--s:1.05;--ly:0rem}
.reduce-motion .t-glint,.reduce-motion .t-spec{display:none}
.reduce-motion .t-lift,.reduce-motion .t-art,.reduce-motion .t-name{transition:transform .2s ease}
.reduce-motion .tile.moving .t-lift{animation:none}
.lite .t-shadow{display:none}
.poster{--tw:24rem;--ar:16/9}
.poster .t-name{justify-content:flex-end;align-items:flex-start;text-align:left;padding:1.4rem 1.6rem;background:linear-gradient(0deg,rgba(0,0,0,.6),transparent 60%);font-size:calc(1.7rem * var(--ts))}
.poster .t-name small{font-weight:500;opacity:.85}

/* rows */
.track{position:relative;display:flex;gap:2.2rem;overflow-x:auto;overflow-y:hidden;padding:1.6rem 6rem 3.4rem;margin-bottom:-2.4rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar,.vscroll::-webkit-scrollbar{display:none}
.row-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 6rem;font-size:calc(1.5rem * var(--ts));font-weight:650;color:var(--fg2);letter-spacing:.01em}
.row-h .hint{font-size:calc(1.15rem * var(--ts));font-weight:500;color:var(--fg3)}
.vscroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}

/* ---------- HOME ---------- */
#s-home .topbar{position:absolute;top:3.4rem;left:6rem;right:6rem;display:flex;align-items:center;justify-content:space-between;z-index:3;transition:opacity .5s,transform .6s var(--spring-soft)}
.brand{display:flex;align-items:center;gap:1rem;font-weight:700;font-size:calc(1.7rem * var(--ts));letter-spacing:.02em}
.brand .logo{width:3.2rem;height:3.2rem}
.top-actions{display:flex;gap:1.2rem}
.clock-wrap{position:absolute;left:6rem;top:12rem;transform-origin:0 0;transition:opacity .45s ease,transform .7s var(--spring-soft)}
.clock{font-size:calc(11rem * min(var(--ts),1.12));font-weight:250;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 .4rem 3rem rgba(0,0,0,.25)}
.theme-light .clock{text-shadow:none}
.clock .ampm{font-size:.3em;font-weight:400;letter-spacing:0;margin-left:.6rem;opacity:.75}
.date{font-size:calc(2.2rem * var(--ts));font-weight:500;margin-top:1rem;opacity:.92}
.greet{font-size:calc(1.5rem * var(--ts));color:var(--fg2);margin-top:.6rem}
.home-shifted .clock-wrap{opacity:0;transform:translate3d(0,-5rem,0) scale(.92)}
#home-stack{position:absolute;left:0;right:0;top:41rem;transition:transform .65s var(--spring-soft)}
.hrow{padding-bottom:.6rem;transition:opacity .35s ease}
.hrow.above{opacity:0;pointer-events:none}
.hrow .row-h{transition:opacity .3s}
.ambient #s-home .topbar,.ambient #home-stack{opacity:0;transform:translate3d(0,4rem,0);pointer-events:none}
.ambient #home-stack{transition:opacity .6s,transform .8s var(--spring-soft)}
.ambient .clock-wrap{opacity:1!important;transform:translate3d(0,14rem,0) scale(1.18)!important}
.ambient #veil{opacity:.35}
.ambient #toast{opacity:0}

/* ---------- launch screen ---------- */
#zoom{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:40;transform-origin:0 0;opacity:0;pointer-events:none;border-radius:1.5rem;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:5rem;overflow:hidden}
#s-launch .launch-bg{position:absolute;inset:0;background:linear-gradient(145deg,var(--c1),var(--c2));opacity:.85}
#s-launch .launch-card{position:absolute;left:50%;top:50%;width:76rem;transform:translate(-50%,-50%);border-radius:3rem;padding:4.4rem 5rem;text-align:center}
.launch-card h1{margin:0;font-size:calc(4.4rem * var(--ts));letter-spacing:-.02em}
.launch-card .host{margin:.8rem 0 0;font-size:calc(1.6rem * var(--ts));color:var(--fg2)}
.launch-card .msg{margin:2.2rem auto 0;max-width:60rem;font-size:calc(1.5rem * var(--ts));color:var(--fg2)}
.launch-card .actions{display:flex;justify-content:center;gap:1.6rem;margin-top:3rem;flex-wrap:wrap}
.safe-note{display:flex;gap:.8rem;align-items:center;justify-content:center;margin-top:2.6rem;font-size:calc(1.2rem * var(--ts));color:var(--fg3)}

/* ---------- headers (store/settings) ---------- */
.scr-head{position:absolute;top:3.4rem;left:6rem;right:6rem;height:5rem;display:flex;align-items:center;justify-content:space-between;z-index:3}
.scr-title{display:flex;align-items:center;gap:1rem;font-size:calc(2rem * var(--ts));font-weight:700}
.scr-title .i{font-size:2.6rem}
.tabs{display:flex;gap:.6rem;padding:.5rem;border-radius:3rem;transition:opacity .3s,transform .5s var(--spring-soft)}
.tab{padding:0 2.2rem;height:4rem;border-radius:2rem;display:flex;align-items:center;font-weight:600;font-size:calc(1.4rem * var(--ts))}
.tab::before{background:transparent}
.tab.sel:not(.focused)::before{background:var(--chip-sel)}
.head-spacer{min-width:12rem;display:flex;justify-content:flex-end;white-space:nowrap}

/* ---------- STORE ---------- */
.st-body{position:absolute;left:0;right:0;top:10rem;bottom:0}
.pane{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translate3d(3rem,0,0);transition:opacity .28s ease,transform .5s var(--spring-soft),visibility 0s linear .5s}
.pane.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s ease,transform .5s var(--spring-soft),visibility 0s}
.pane.left{transform:translate3d(-3rem,0,0)}
.pane.vscroll{padding-bottom:6rem}
.hero{position:relative;margin:1.8rem 6rem 1rem;height:30rem;border-radius:2.4rem;transition:transform .5s var(--spring)}
.hero .slides{position:absolute;inset:0;border-radius:inherit;overflow:hidden;isolation:isolate;transform:translateZ(0)}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;background:linear-gradient(120deg,var(--c1),var(--c2))}
.hero .slide.on{opacity:1}
.hero .slide img{position:absolute;right:0;top:0;height:100%;width:62%;object-fit:cover;opacity:.9;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.hero .copy{position:absolute;left:4.4rem;top:50%;transform:translateY(-50%);max-width:52rem;color:#fff}
.hero .kicker{font-size:calc(1.2rem * var(--ts));font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero h2{margin:.6rem 0 .6rem;font-size:calc(4.2rem * var(--ts));letter-spacing:-.02em;line-height:1.05}
.hero p{margin:0;font-size:calc(1.5rem * var(--ts));opacity:.88}
.hero .cta{margin-top:2rem;display:inline-flex;align-items:center;gap:.8rem;height:4.4rem;padding:0 2.2rem;border-radius:2.2rem;background:rgba(255,255,255,.2);font-weight:650}
.hero.focused{transform:scale(1.02)}
.hero.focused .cta{background:#fff;color:#0a0c12}
.hero .ring{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .25rem rgba(255,255,255,.8);opacity:0;transition:opacity .2s}
.hero.focused .ring{opacity:1}
.hero .dots{position:absolute;right:3rem;bottom:2.4rem;display:flex;gap:.8rem}
.hero .dots i{width:.9rem;height:.9rem;border-radius:50%;background:#fff;opacity:.35;transition:opacity .3s,transform .3s var(--spring)}
.hero .dots i.on{opacity:1;transform:scale(1.25)}
.hero .arrows{position:absolute;left:4.4rem;bottom:2.4rem;font-size:calc(1.15rem * var(--ts));color:rgba(255,255,255,.75);opacity:0;transition:opacity .3s}
.hero.focused .arrows{opacity:1}
.reduce-motion .hero.focused{transform:none}
.st-row{margin-top:1.4rem}
.st-row .tile{--tw:16rem}
.st-row .t-title,.grid .t-title{opacity:1;transform:none}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6rem;padding:2.2rem 6rem}
.cat{height:15rem;border-radius:2rem;display:flex;flex-direction:column;justify-content:flex-end;padding:2.2rem 2.6rem;color:#fff;overflow:hidden}
.cat::before{background:linear-gradient(140deg,var(--c1),var(--c2))!important}
.cat .i{position:absolute;right:2.4rem;top:2.2rem;font-size:5rem;opacity:.85;stroke-width:1.5}
.cat b{font-size:calc(2.4rem * var(--ts));letter-spacing:-.01em}
.cat span{font-size:calc(1.25rem * var(--ts));opacity:.85}
.cat.focused{color:#fff}
.cat.focused::after{background:transparent;box-shadow:inset 0 0 0 .25rem #fff,0 1.8rem 3rem var(--shadow)}
.list-head{display:flex;align-items:center;gap:1.4rem;padding:1.6rem 6rem 0;font-size:calc(3rem * var(--ts));font-weight:700;letter-spacing:-.01em}
.list-head .i{font-size:3.4rem}
.list-head small{font-size:calc(1.4rem * var(--ts));font-weight:500;color:var(--fg2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,16rem);gap:2.2rem 2.4rem;padding:2rem 6rem 4rem;justify-content:start}
.grid .tile{--tw:16rem}
/* search */
.search{display:grid;grid-template-columns:44rem 1fr;gap:4rem;padding:1.6rem 6rem 0;height:100%}
.qbox{height:6rem;border-radius:1.6rem;display:flex;align-items:center;gap:1.2rem;padding:0 2rem;font-size:calc(2rem * var(--ts));margin-bottom:2rem}
.qbox .q{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbox .q:empty::before{content:"Search apps and games";color:var(--fg3)}
.qbox .caret{width:.2rem;height:2.6rem;background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.reduce-motion .qbox .caret{animation:none}
.kb{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem}
.key{height:5.4rem;border-radius:1.2rem;display:flex;align-items:center;justify-content:center;font-size:calc(1.8rem * var(--ts));font-weight:600;text-transform:uppercase}
.key.w2{grid-column:span 2;font-size:calc(1.3rem * var(--ts));text-transform:none}
.key .i{font-size:2.2rem}
.results{min-width:0;height:100%}
.results .grid{padding:0 0 6rem;grid-template-columns:repeat(auto-fill,15rem)}
.results .grid .tile{--tw:15rem}
.res-h{font-size:calc(1.5rem * var(--ts));font-weight:650;color:var(--fg2);margin:.4rem 0 1.4rem}
.empty{color:var(--fg2);font-size:calc(1.6rem * var(--ts));padding:2rem 0}
/* detail */
.detail{padding:1.4rem 6rem 6rem}
.d-top{display:grid;grid-template-columns:30rem 1fr;gap:4.4rem;align-items:center}
.d-icon{--tw:30rem}
.d-icon .t-name{font-size:calc(3rem * var(--ts))}
.d-icon .t-name .i{font-size:7rem}
.d-name{margin:0;font-size:calc(4.2rem * var(--ts));letter-spacing:-.02em;line-height:1.05}
.d-dev{margin:.6rem 0 0;font-size:calc(1.5rem * var(--ts));color:var(--fg2)}
.chips{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.8rem}
.chip{display:inline-flex;align-items:center;gap:.6rem;height:3.4rem;padding:0 1.4rem;border-radius:1.7rem;background:var(--chip);font-size:calc(1.25rem * var(--ts));font-weight:600}
.chip .i{font-size:1.5rem}
.stars{display:inline-flex;gap:.15rem;color:#ffd166}
.stars .i{fill:currentColor;stroke:none}
.stars .i.off{fill:rgba(255,255,255,.25)}
.theme-light .stars .i.off{fill:rgba(0,0,0,.18)}
.d-actions{display:flex;gap:1.4rem;margin-top:2.4rem;flex-wrap:wrap}
.install{min-width:20rem;overflow:hidden}
.install .pbar{position:absolute;inset:0;border-radius:inherit;background:var(--accent);opacity:.6;transform-origin:0 50%;transform:scaleX(0);z-index:0;transition:transform .12s linear}
.install .lbl,.install .i{position:relative;z-index:1}
.set-row .val .i{font-size:2.2rem}
.install:not(.busy) .pbar{opacity:0}
.d-sec{margin-top:3.4rem}
.d-sec h3{margin:0 0 .4rem;font-size:calc(1.6rem * var(--ts));color:var(--fg2);font-weight:650}
.d-sec .track{padding-left:0;padding-right:0;margin:0 -1rem;padding:1.6rem 1rem 1.2rem}
.shot{--tw:34rem;--ar:16/9}
.d-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:3rem;margin-top:1.4rem}
.card{border-radius:2rem;padding:2.4rem 2.8rem;font-size:calc(1.4rem * var(--ts));line-height:1.5}
.card.fx::before{background:var(--chip)}
.card p{margin:0 0 1rem}.card p:last-child{margin:0}
.card h4{margin:0 0 1rem;font-size:calc(1.5rem * var(--ts))}
.bars{display:grid;gap:.7rem;margin-top:1rem}
.bar{display:grid;grid-template-columns:2rem 1fr;gap:1rem;align-items:center;font-size:calc(1.1rem * var(--ts))}
.bar span{height:.7rem;border-radius:.4rem;background:var(--chip);overflow:hidden;position:relative}
.bar span b{position:absolute;inset:0;background:currentColor;opacity:.7;transform-origin:0 50%}
.sim{font-size:calc(1.05rem * var(--ts));color:var(--fg3);margin-top:1rem}

/* ---------- SETTINGS ---------- */
.set-side{position:absolute;left:4rem;top:11rem;bottom:4rem;width:32rem;border-radius:2.6rem;padding:1.6rem}
.set-side .vscroll{height:100%}
.side-item{display:flex;width:100%;align-items:center;gap:1.4rem;height:5.4rem;padding:0 1.8rem;border-radius:1.6rem;font-size:calc(1.5rem * var(--ts));font-weight:600;margin-bottom:.4rem}
.side-item::before{background:transparent}
.side-item.sel:not(.focused)::before{background:var(--chip-sel)}
.side-item .i{font-size:2.2rem}
.set-main{position:absolute;left:40rem;right:4rem;top:11rem;bottom:0;padding:0 2rem 6rem}
.set-panel{transition:opacity .25s ease,transform .45s var(--spring-soft)}
.set-panel.enter{opacity:0;transform:translate3d(2.4rem,0,0)}
.set-h{font-size:calc(3rem * var(--ts));font-weight:700;letter-spacing:-.015em;margin:.4rem 0 .4rem}
.set-lead{color:var(--fg2);font-size:calc(1.4rem * var(--ts));margin:0 0 1.8rem;max-width:70rem}
.group{margin:2.6rem 0 .8rem;font-size:calc(1.2rem * var(--ts));font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:2.4rem;min-height:6rem;padding:1.2rem 2.2rem;border-radius:1.6rem;margin-bottom:.8rem}
.set-row .txt{min-width:0}
.set-row .lbl{font-size:calc(1.55rem * var(--ts));font-weight:600;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.set-row .sub{font-size:calc(1.2rem * var(--ts));color:var(--fg2);margin-top:.3rem}
.fx.focused .sub,.fx.focused .val,.fx.focused .t-sub{color:inherit;opacity:.72}
.set-row .val{font-size:calc(1.4rem * var(--ts));color:var(--fg2);white-space:nowrap;text-align:right}
.set-row.static{background:var(--chip)}
.set-row.choice{background:transparent;padding-left:2.2rem;padding-right:0;flex-wrap:wrap;row-gap:1rem}
.set-row.choice .txt{flex:1 1 24rem}
.seg{display:flex;gap:.8rem;flex:0 0 auto;justify-content:flex-end}
.opt{height:4.4rem;padding:0 2rem;border-radius:2.2rem;display:inline-flex;align-items:center;gap:.6rem;font-size:calc(1.3rem * var(--ts));font-weight:600;white-space:nowrap}
.opt .i{font-size:1.5rem;stroke-width:3;display:none}
.opt.sel .i{display:inline-block}
.switch{position:relative;width:6rem;height:3.4rem;border-radius:1.7rem;flex:0 0 auto}
.switch::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(128,128,140,.45)}
.switch::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#34c77b;opacity:0;transition:opacity .2s}
.switch.on::after{opacity:1}
.switch i{position:absolute;left:.3rem;top:.3rem;width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;z-index:1;box-shadow:0 .2rem .6rem rgba(0,0,0,.3);transition:transform .45s var(--spring)}
.switch.on i{transform:translate3d(2.6rem,0,0)}
.badge{display:inline-flex;white-space:nowrap;align-items:center;height:2.3rem;padding:0 1rem;border-radius:1.2rem;font-size:calc(1rem * var(--ts));font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.badge.sim{background:rgba(255,170,60,.18);color:#ffb35c;margin:0}
.badge.real{background:rgba(52,199,123,.18);color:#43d68b}
.theme-light .badge.sim{color:#a35a00;background:rgba(255,150,0,.16)}
.theme-light .badge.real{color:#127a43}
.hc .badge.sim,.hc .badge.real{background:transparent;border:2px solid currentColor}
.fx.focused .badge{background:rgba(128,128,128,.25);color:inherit}
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4rem 2.4rem;padding:.6rem 0 1rem}
.wp-grid .tile{--tw:100%;--ar:16/9}
.wp-grid .t-title{opacity:1;transform:none}
.note{display:flex;gap:1.2rem;align-items:flex-start;padding:1.6rem 2rem;border-radius:1.6rem;background:rgba(255,170,60,.12);color:var(--fg);font-size:calc(1.3rem * var(--ts));margin:1rem 0}
.note .i{font-size:2.2rem;color:#ffb35c;margin-top:.1rem}
.det-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem 1.2rem}
.det-grid .set-row{margin:0}
.about-hero{display:flex;align-items:center;gap:2.6rem;padding:2.6rem 3rem;border-radius:2.4rem;margin-bottom:1.4rem}
.about-hero .logo{width:9rem;height:9rem}
.about-hero h2{margin:0;font-size:calc(3.4rem * var(--ts));letter-spacing:-.02em}
.about-hero p{margin:.4rem 0 0;color:var(--fg2)}
.concept{border:.2rem solid rgba(255,179,92,.65)!important}
.concept b{color:#ffb35c}
.theme-light .concept b{color:#a35a00}
.kbd-table .set-row .val{font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---------- layers ---------- */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.layer .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s ease}
.layer.open .backdrop{opacity:1}
.layer .panel{position:relative;isolation:isolate;opacity:0;transform:translate3d(0,2.4rem,0) scale(.95);transition:opacity .22s ease,transform .55s var(--spring)}
.layer.open .panel{opacity:1;transform:none}
.layer.side{justify-content:flex-end}
.layer.side .panel{height:calc(100% - 4rem);margin-right:2rem;width:44rem;border-radius:2.8rem;transform:translate3d(110%,0,0);opacity:1;padding:2.6rem 2rem;display:flex;flex-direction:column}
.layer.side.open .panel{transform:none}
.layer.sheet{align-items:flex-end}
.layer.sheet .panel{transform:translate3d(0,110%,0);opacity:1;margin-bottom:3rem}
.layer.sheet.open .panel{transform:none}
.reduce-motion .layer .panel{transform:none!important;transition:opacity .2s ease}
.reduce-motion .layer.side .panel,.reduce-motion .layer.sheet .panel{opacity:0}
.reduce-motion .layer.open .panel{opacity:1}
.dlg{width:64rem;border-radius:2.8rem;padding:3.6rem 4rem;text-align:center}
.dlg h2{margin:0;font-size:calc(2.6rem * var(--ts));letter-spacing:-.01em}
.dlg p{margin:1.2rem 0 0;color:var(--fg2);font-size:calc(1.45rem * var(--ts))}
.dlg .actions{display:flex;justify-content:center;gap:1.4rem;margin-top:2.8rem;flex-wrap:wrap}
.opts{border-radius:2.6rem;padding:2.2rem;display:flex;gap:1.2rem;align-items:center}
.opts .who{font-weight:700;font-size:calc(1.6rem * var(--ts));padding:0 1.6rem 0 1rem}
.pin{width:48rem;padding:3.4rem 3.6rem 3rem}
.pdots{display:flex;justify-content:center;gap:2rem;margin:2.4rem 0 .6rem}
.pdots i{width:2rem;height:2rem;border-radius:50%;border:.2rem solid var(--fg);position:relative}
.pdots i::after{content:"";position:absolute;inset:.2rem;border-radius:50%;background:var(--fg);transform:scale(0);transition:transform .3s var(--spring)}
.pdots i.on::after{transform:scale(1)}
.pdots.shake{animation:shake .45s var(--out)}
@keyframes shake{20%{translate:-1.2rem 0}40%{translate:1rem 0}60%{translate:-.7rem 0}80%{translate:.4rem 0}}
.pin-msg{min-height:2.2rem;font-size:calc(1.25rem * var(--ts));color:#ff7a7a}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;margin-top:1.2rem}
.pad .key{height:6rem;font-size:calc(2.2rem * var(--ts))}
.pad .key.small{font-size:calc(1.3rem * var(--ts))}
.qm-h{display:flex;align-items:center;gap:1rem;font-size:calc(2rem * var(--ts));font-weight:700;margin:0 1rem 1.6rem}
.qm-list{flex:1;min-height:0}
.qm-list .set-row{min-height:5.4rem}
.show-dlg{width:80rem;border-radius:2.8rem;overflow:hidden;padding:0;text-align:left}
.show-dlg img{display:block;width:100%;aspect-ratio:16/7;object-fit:cover}
.show-dlg .body{padding:2.8rem 3.4rem 3.2rem}
.show-dlg .actions{justify-content:flex-start}

/* toast */
#toast{position:fixed;left:50%;bottom:4.4rem;z-index:60;transform:translate3d(-50%,8rem,0);opacity:0;border-radius:3rem;padding:1.3rem 2.6rem;display:flex;align-items:center;gap:1rem;
  font-size:calc(1.4rem * var(--ts));font-weight:600;transition:opacity .25s,transform .55s var(--spring);pointer-events:none;max-width:90rem}
#toast.show{opacity:1;transform:translate3d(-50%,0,0)}
#toast .i{font-size:2rem;color:var(--accent2)}
#fps{position:fixed;top:1rem;right:1rem;z-index:70;font:600 1.2rem/1 ui-monospace,Menlo,Consolas,monospace;padding:.6rem .9rem;border-radius:.8rem;background:rgba(0,0,0,.6);color:#9dffb0;display:none}
.show-fps #fps{display:block}

/* game */
#s-game .g-wrap{position:absolute;left:50%;top:53%;width:96rem;transform:translate(-50%,-50%)}
#s-game canvas{display:block;width:96rem;height:54rem;border-radius:2rem;background:#05080c}
.g-hud{display:flex;justify-content:space-between;font-size:calc(1.6rem * var(--ts));font-weight:650;margin-bottom:1.2rem;padding:0 .4rem}
.g-hud span{color:var(--fg2);font-weight:500}
.g-over{position:absolute;left:50%;top:calc(50% + 1.5rem);transform:translate(-50%,-50%);text-align:center;border-radius:2.6rem;padding:3rem 4rem;transition:opacity .25s}
.g-over.off{opacity:0;pointer-events:none}
.g-over h2{margin:0 0 .6rem;font-size:calc(3rem * var(--ts))}
.g-over p{margin:0 0 2rem;color:var(--fg2)}
.g-over .actions{display:flex;gap:1.4rem;justify-content:center}

@media (prefers-reduced-motion:reduce){.wp *{animation-play-state:paused!important}}
</style>
</head>

function install(id) {
  const a = APPS[id];
  withPin(a, `Enter PIN to install ${a.name}`, () => {
    if (INST[id] || installed(id)) return;
    const start = performance.now(), dur = 2000 + Math.random() * 1400;
    INST[id] = {p: 0};
    const step = () => {
      const t = Math.min(1, (performance.now() - start) / dur);
      INST[id].p = t < 1 ? 1 - Math.pow(1 - t, 2.2) : 1;
      $$(`[data-install="${id}"]`).forEach(b => { b.classList.add('busy'); b.removeAttribute('data-act'); const pb = $('.pbar', b); if (pb) pb.style.transform = `scaleX(${INST[id].p})`; $('.lbl', b).textContent = `Installing ${Math.round(INST[id].p * 100)}%`; });
      $$(`.tile[data-app="${id}"] .t-prog b`).forEach(b => b.style.transform = `scaleX(${INST[id].p})`);
      if (t < 1) setTimeout(step, 60);
      else {
        delete INST[id];
        const list = a.cat === 'Games' ? S.games : S.apps;
        const at = list.indexOf('store'); if (at >= 0) list.splice(at, 0, id); else list.push(id);
        save(); renderHome(); storeRefresh(); toast(`${a.name} added to Home`);
      }
    };
    storeRefresh(); step();
  });
}

/* detection — real values where the browser exposes them */
const DET = {hz: 0, codec: {}, ch: '', spatial: '', ran: false};
function detectDisplay() {
  const dpr = devicePixelRatio || 1, pw = Math.round(screen.width * dpr), ph = Math.round(screen.height * dpr);
  const long = Math.max(pw, ph), short = Math.min(pw, ph);
  const [label, sh] = long >= 3800 || short >= 2100 ? ['4K UHD (2160p)', '4K'] : long >= 2500 ? ['QHD (1440p)', '1440p'] : long >= 1900 ? ['Full HD (1080p)', '1080p'] : long >= 1270 ? ['HD (720p)', '720p'] : ['Standard definition', 'SD'];
  return {pw, ph, label: label + ' · browser-reported', short: sh,
    hdr: mm('(dynamic-range: high)') || mm('(video-dynamic-range: high)'),
    gamut: mm('(color-gamut: rec2020)') ? 'Rec. 2020' : mm('(color-gamut: p3)') ? 'Display P3' : mm('(color-gamut: srgb)') ? 'sRGB' : 'Not reported'};
}
async function probe(cfgs) {
  if (!navigator.mediaCapabilities || !navigator.mediaCapabilities.decodingInfo) return 'Not reported';
  let any = false;
  for (const c of cfgs) { try { const r = await navigator.mediaCapabilities.decodingInfo(c); any = true; if (r.supported) return 'Supported (reported)'; } catch (e) {} }
  return any ? 'Not supported (reported)' : 'Not reported';
}
function runDetection() {
  if (DET.ran) return; DET.ran = true;
  const V = (codec, extra) => ({type: 'media-source', video: Object.assign({contentType: `video/mp4; codecs="${codec}"`, width: 3840, height: 2160, bitrate: 20000000, framerate: 24}, extra)});
  const VP9 = extra => ({type: 'media-source', video: Object.assign({contentType: 'video/webm; codecs="vp09.02.51.10.01.09.16.09.00"', width: 3840, height: 2160, bitrate: 20000000, framerate: 24}, extra)});
  const pq = {colorGamut: 'rec2020', transferFunction: 'pq'};
  const jobs = {
    hdr10: [V('hvc1.2.4.L153.B0', Object.assign({hdrMetadataType: 'smpteSt2086'}, pq)), VP9(Object.assign({hdrMetadataType: 'smpteSt2086'}, pq))],
    hdr10p: [V('hvc1.2.4.L153.B0', Object.assign({hdrMetadataType: 'smpteSt2094-40'}, pq))],
    dv: [V('dvh1.05.06', Object.assign({hdrMetadataType: 'smpteSt2094-10'}, pq))],
    hlg: [V('hvc1.2.4.L153.B0', {colorGamut: 'rec2020', transferFunction: 'hlg'}), VP9({colorGamut: 'rec2020', transferFunction: 'hlg'})],
  };
  for (const [k, cfg] of Object.entries(jobs)) probe(cfg).then(r => { DET.codec[k] = r; const n = $('#det-' + k); if (n) n.textContent = r; });
  probe([{type: 'media-source', audio: {contentType: 'audio/mp4; codecs="ec-3"', channels: '16', bitrate: 768000, samplerate: 48000, spatialRendering: true}}]).then(r => { DET.spatial = r; const n = $('#det-sp'); if (n) n.textContent = r; });
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { const ac = new AC(); DET.ch = String(ac.destination.maxChannelCount || 'Not reported'); ac.close && ac.close().catch(() => {}); } else DET.ch = 'Not reported';
  } catch (e) { DET.ch = 'Not reported'; }
  const n = $('#det-ch'); if (n) n.textContent = DET.ch;
}

/* ---------------- GAME: Glow Snake (built-in, original) ---------------- */
const G = {cols: 32, rows: 18, run: false, raf: 0};
function gameEnter() {
  const el = SCREENS.game.el;
  el.innerHTML = `<div class="scr-head"><div class="scr-title">${ico('snake')}<span>Glow Snake</span></div><div class="badge real">Lumora Original</div></div>
    <div class="g-wrap"><div class="g-hud"><div>Score <b id="g-score">0</b></div><div><span>Best</span> <b id="g-best">${S.best}</b></div></div><canvas id="g-cv" aria-label="Game board"></canvas></div>
    <div class="g-over glass-strong" id="g-over"></div>`;
  gameReset(); gameMenu('start');
}
function gameReset() {
  const cv = $('#g-cv'); const r = cv.getBoundingClientRect(); const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.max(320, Math.round(r.width * dpr)); cv.height = Math.max(180, Math.round(r.height * dpr));
  G.snake = [[8, 9], [7, 9], [6, 9]]; G.dir = [1, 0]; G.next = [1, 0]; G.score = 0; G.acc = 0; G.last = 0; G.step = 125;
  placeFood(); $('#g-score').textContent = '0'; draw();
}
function placeFood() { do { G.food = [Math.floor(Math.random() * G.cols), Math.floor(Math.random() * G.rows)]; } while (G.snake.some(s => s[0] === G.food[0] && s[1] === G.food[1])); }
function gameMenu(kind) {
  const o = $('#g-over'); G.run = false; cancelAnimationFrame(G.raf);
  const t = {start: ['Glow Snake', 'Use the arrow keys to steer. Eat the light, avoid your tail.', 'Play'], pause: ['Paused', 'Take a breather.', 'Resume'], over: ['Game over', `You scored ${G.score}.`, 'Play again']}[kind];
  o.innerHTML = `<h2>${t[0]}</h2><p>${t[1]}</p><div class="actions"><button class="btn primary fx" data-f data-act="g:${kind === 'pause' ? 'resume' : 'play'}" tabindex="-1">${ico('play')}${t[2]}</button><button class="btn fx" data-f data-act="home" tabindex="-1">Exit</button></div>`;
  o.classList.remove('off'); dropFocus(); ensureFocus();
}
function gamePlay(resume) {
  if (!resume) gameReset();
  $('#g-over').classList.add('off'); dropFocus();
  G.run = true; G.last = performance.now(); G.raf = requestAnimationFrame(loop);
}
function loop(t) {
  if (!G.run) return;
  G.acc += t - G.last; G.last = t;
  while (G.acc >= G.step && G.run) { G.acc -= G.step; stepGame(); }
  draw(); if (G.run) G.raf = requestAnimationFrame(loop);
}
function stepGame() {
  if (G.next[0] !== -G.dir[0] || G.next[1] !== -G.dir[1]) G.dir = G.next;
  const h = [G.snake[0][0] + G.dir[0], G.snake[0][1] + G.dir[1]];
  if (h[0] < 0 || h[1] < 0 || h[0] >= G.cols || h[1] >= G.rows || G.snake.some(s => s[0] === h[0] && s[1] === h[1])) {
    if (G.score > S.best) { S.best = G.score; save(); $('#g-best').textContent = S.best; }
    gameMenu('over'); return;
  }
  G.snake.unshift(h);
  if (h[0] === G.food[0] && h[1] === G.food[1]) { G.score++; $('#g-score').textContent = G.score; G.step = Math.max(65, G.step - 3); placeFood(); } else G.snake.pop();
}
function draw() {
  const cv = $('#g-cv'); if (!cv) return; const x = cv.getContext('2d'); const W = cv.width, H = cv.height, cw = W / G.cols, ch = H / G.rows;
  x.fillStyle = '#05080c'; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,255,255,.035)';
  for (let i = 0; i < G.cols; i++) for (let j = 0; j < G.rows; j++) if ((i + j) % 2) x.fillRect(i * cw, j * ch, cw, ch);
  const glow = !lite;
  x.shadowColor = '#ffd166'; x.shadowBlur = glow ? cw * .8 : 0; x.fillStyle = '#ffd166';
  x.beginPath(); x.arc((G.food[0] + .5) * cw, (G.food[1] + .5) * ch, cw * .32, 0, Math.PI * 2); x.fill();
  x.shadowColor = '#4fe3c1'; x.shadowBlur = glow ? cw * .6 : 0;
  G.snake.forEach((s, i) => { x.fillStyle = i ? `rgba(79,227,193,${Math.max(.35, 1 - i / (G.snake.length + 4))})` : '#b8fff0'; const p = cw * .1; x.beginPath(); x.roundRect ? x.roundRect(s[0] * cw + p, s[1] * ch + p, cw - 2 * p, ch - 2 * p, cw * .25) : x.rect(s[0] * cw + p, s[1] * ch + p, cw - 2 * p, ch - 2 * p); x.fill(); });
  x.shadowBlur = 0;
}
function gameKey(k) {
  const d = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]}[k];
  if (d) { G.next = d; return true; }
  if (k === 'ok' || k === 'space' || k === 'back' || k === 'backspace') { gameMenu('pause'); return true; }
  return false;
}
function gameBack() { if ($('#g-over') && !$('#g-over').classList.contains('off')) show('home'); else gameMenu('pause'); }
function gameLeave() { G.run = false; cancelAnimationFrame(G.raf); }

const HOOKS = {
  tab(el) { if (!el.dataset.tab) return; clearTimeout(ST.tabT); ST.tabT = setTimeout(() => { if (F.cur === el && ST.tab !== el.dataset.tab) selectTab(el.dataset.tab); }, 110); },
  side(el) { const s = el.dataset.sec; if (!s || s === SET.sec) return; clearTimeout(SET.renderT); SET.renderT = setTimeout(() => { if (F.cur !== el) return; SET.sec = s; SET.unlocked = false; $$('#s-settings .side-item').forEach(b => b.classList.toggle('sel', b.dataset.sec === s)); renderSection(true); }, 90); },
};
function activate(el) {
  if (!el || el.getAttribute('aria-disabled') === 'true') return;
  const act = el.dataset.act; if (!act) return;
  const i = act.indexOf(':'); const k = i < 0 ? act : act.slice(0, i), v = i < 0 ? '' : act.slice(i + 1);
  const L = layers[layers.length - 1];
  switch (k) {
    case 'open': openApp(v, el); break;
    case 'search': show('store', {tab: 'search'}); break;
    case 'quick': openQuick(); break;
    case 'screen': closeAllLayers(); show(v); break;
    case 'home': goHome(); break;
    case 'relaunch': { const a = APPS[v]; const w = window.open(a.url, '_blank'); if (w) w.opener = null; else toast('The new tab was blocked — try “Open in this tab”', 'info'); break; }
    case 'here': location.href = APPS[v].url; break;
    case 'show': { const s = SHOWS[+v]; openLayer({label: s.t, def: '#show-close', html: `<div class="dlg show-dlg glass-strong"><img alt="" src="${sceneSVG(s.t, s.c[0], s.c[1], 1200, 525)}"><div class="body"><h2>${esc(s.t)}</h2><p>${esc(s.g)} · ${esc(s.d)}</p><p style="font-size:calc(1.2rem * var(--ts))">${ico('info')} Fictional title with original concept artwork. Not available to watch.</p><div class="actions"><button class="btn primary fx" data-f data-act="dlgcancel" id="show-close" tabindex="-1">Close</button><button class="btn fx" data-f data-act="screen:store" tabindex="-1">${ico('store')}Browse the Store</button></div></div></div>`}); break; }
    case 'tab': selectTab(v); { const p = $(`#p-${v}`); const f = p && $$('[data-f]', p).find(visible); if (f) setFocus(f, {dir: 'down'}); } break;
    case 'cat': openCat(v); break;
    case 'app': openDetail(v); break;
    case 'hero': openDetail(HERO[ST.hero]); break;
    case 'install': install(v); break;
    case 'key': typeKey(v); break;
    case 'sec': { const f = $$('#set-main [data-f]').find(visible); if (f) setFocus(f, {dir: 'right'}); break; }
    case 'tog': doToggle(el, v); break;
    case 'set': { const j = v.lastIndexOf(':'); doSet(el, v.slice(0, j), v.slice(j + 1)); break; }
    case 'wp': S.wallpaper = v; save(); setWallpaper(v); renderSection(); break;
    case 'nextwp': { const ix = WALLS.findIndex(w => w.id === S.wallpaper); S.wallpaper = WALLS[(ix + 1) % WALLS.length].id; save(); setWallpaper(S.wallpaper); if (L && L.qm) refreshQuick(L); break; }
    case 'ambient': enterAmbient(); break;
    case 'fullscreen': toggleFullscreen(); break;
    case 'punlock': pinPrompt({title: 'Enter PIN', sub: 'Unlock Parental Controls settings.', onOk: () => { SET.unlocked = true; renderSection(); const f = $('#set-main [data-k="parental.on"]'); if (f) setFocus(f); }}); break;
    case 'chpin': pinPrompt({title: 'Create a PIN', sub: 'Choose four new digits.', mode: 'set', onOk: () => toast('PIN changed', 'shield')}); break;
    case 'erase': confirmDlg('Erase all local data?', 'Every setting, your Home layout and the Parental Controls PIN will be reset on this device.', 'Erase', () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); }); break;
    case 'pin': if (L) pinInputSync(L, v); break;
    case 'dlgcancel': closeLayer(); break;
    case 'dlgok': { const cb = L && L.ok; closeLayer(L, true); cb && cb(); break; }
    case 'oopen': { const {id, tile} = L; closeLayer(L, true); openApp(id, tile); break; }
    case 'omove': { const {row, id} = L; closeLayer(L, true); startMove(row, id); break; }
    case 'oremove': { if (v) { removeApp(v); break; } const {id} = L; closeLayer(L, true); removeApp(id); break; }
    case 'ostore': { const {id} = L; closeAllLayers(); show('store'); openDetail(id); break; }
    case 'g': gamePlay(v === 'resume'); break;
  }
}

/* =====================================================================
   INPUT — remote / keyboard / mouse / touch
   ===================================================================== */
function keyOf(e) {
  const k = e.key, c = e.keyCode;
  if (k === 'ArrowUp' || k === 'Up' || c === 38) return 'up';
  if (k === 'ArrowDown' || k === 'Down' || c === 40) return 'down';
  if (k === 'ArrowLeft' || k === 'Left' || c === 37) return 'left';
  if (k === 'ArrowRight' || k === 'Right' || c === 39) return 'right';
  if (k === 'Enter' || k === 'Select' || k === 'Accept' || c === 13) return 'ok';
  if (k === 'Escape' || k === 'Esc' || k === 'BrowserBack' || k === 'GoBack' || k === 'Back' || c === 27 || c === 461 || c === 10009) return 'back';
  if (k === 'Backspace' || c === 8) return 'backspace';
  if (k === 'Home' || k === 'BrowserHome' || k === 'GoHome' || c === 36) return 'home';
  if (k === 'ContextMenu' || k === 'Info' || k === 'ContextMenu' || c === 93 || c === 457) return 'menu';
  if (k === 'Tab') return e.shiftKey ? 'left' : 'right';
  if (k === ' ' || k === 'Spacebar') return 'space';
  if (/^[0-9]$/.test(k)) return 'digit';
  if (k && k.length === 1) return 'char';
  return null;
}
let hold = null;
function setKbd(on) { root.classList.toggle('kbd', on); }
const searching = () => curScreen === 'store' && ST.view === 'tabs' && ST.tab === 'search' && !layers.length;
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  let k = keyOf(e); if (!k) return;
  e.preventDefault(); setKbd(true); bumpIdle();
  if (isAmbient()) { if (!e.repeat) exitAmbient(); return; }
  if (curScreen === 'game' && G.run && !layers.length) { gameKey(k); return; }
  const top = layers[layers.length - 1];
  if (top && top.onKey && top.onKey(k, e)) return;
  if (searching() && (k === 'char' || k === 'digit')) { typeKey(e.key.toLowerCase()); return; }
  if (searching() && k === 'backspace' && ST.q) { typeKey('del'); return; }
  if (k === 'char') { const c = e.key.toLowerCase(); if (c === 'h') k = 'home'; else if (c === 'o' || c === 'm') k = 'menu'; else return; }
  switch (k) {
    case 'up': case 'down': case 'left': case 'right': if (moving) moveTile(k); else move(k); break;
    case 'ok': case 'space':
      if (e.repeat) return;
      if (moving) { endMove(); toast('Done', 'check'); break; }
      if (!inScope(F.cur)) { ensureFocus(); break; }
      if (F.cur.dataset.hold) { const el = F.cur; hold = {el, k, fired: false, t: setTimeout(() => { hold.fired = true; openOptions(el); }, 560)}; }
      else activate(F.cur);
      break;
    case 'back': case 'backspace': if (!e.repeat) goBack(); break;
    case 'home': if (!e.repeat) goHome(); break;
    case 'menu': if (!e.repeat && !moving && F.cur && F.cur.dataset.hold) openOptions(F.cur); break;
  }
  setTimeout(ensureFocus, 0);
});
document.addEventListener('keyup', e => {
  const k = keyOf(e);
  if ((k === 'ok' || k === 'space') && hold && hold.k === k) {
    clearTimeout(hold.t); const h = hold; hold = null;
    if (!h.fired && h.el === F.cur && inScope(h.el)) activate(h.el);
  }
});
/* pointer */
let lp = null, lpFired = false;
document.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { if (root.classList.contains('kbd')) setKbd(false); }
  bumpIdle();
  const t = F.cur; if (!t || !t.classList.contains('tile') || S.reduceMotion || e.pointerType !== 'mouse') return;
  if (!t.contains(e.target)) { if (t.classList.contains('tracking')) { t.classList.remove('tracking'); t.style.setProperty('--px', 0); t.style.setProperty('--py', 0); } return; }
  const r = t.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
  t.classList.add('tracking'); t.style.setProperty('--px', Math.max(-.5, Math.min(.5, px)).toFixed(3)); t.style.setProperty('--py', Math.max(-.5, Math.min(.5, py)).toFixed(3));
  if (lp && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 12) { clearTimeout(lp.t); lp = null; }
}, {passive: true});
document.addEventListener('pointerover', e => {
  if (e.pointerType !== 'mouse' || isAmbient() || moving) return;
  const el = e.target.closest && e.target.closest('[data-f]');
  if (el && inScope(el) && !(curScreen === 'game' && G.run)) setFocus(el, {src: 'pointer'});
});
document.addEventListener('pointerdown', e => {
  bumpIdle();
  if (e.pointerType === 'mouse') return;
  const el = e.target.closest && e.target.closest('[data-f][data-hold]');
  lpFired = false;
  if (el) lp = {x: e.clientX, y: e.clientY, t: setTimeout(() => { lpFired = true; setFocus(el, {src: 'pointer'}); openOptions(el); lp = null; }, 600)};
}, {passive: true});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { if (lp) { clearTimeout(lp.t); lp = null; } }, {passive: true}));
document.addEventListener('click', e => {
  if (isAmbient()) { exitAmbient(); return; }
  if (lpFired) { lpFired = false; return; }
  if (e.target.closest('[data-close]')) { closeLayer(); return; }
  if (curScreen === 'game' && G.run && !layers.length) { gameMenu('pause'); return; }
  const el = e.target.closest('[data-f]'); if (!el || !inScope(el)) return;
  if (moving) { endMove(); return; }
  setFocus(el, {src: 'pointer'}); activate(el);
  setTimeout(ensureFocus, 0);
});
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-f][data-hold]'); e.preventDefault();
  if (el && inScope(el) && !lpFired) { setFocus(el, {src: 'pointer'}); openOptions(el); }
});
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-f]'); if (el && el !== F.cur && inScope(el)) setFocus(el, {noScroll: true}); });
let wheelLock = 0;
$('#s-home').addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) < Math.abs(e.deltaX) || Math.abs(e.deltaY) < 8) return;
  const now = Date.now(); if (now - wheelLock < 350) return; wheelLock = now;
  move(e.deltaY > 0 ? 'down' : 'up');
}, {passive: true});

/* =====================================================================
   PERFORMANCE — measure fps, auto-reduce effects if it drops.
   ===================================================================== */
let autoLite = false, fps = 60, frames = 0, last = performance.now(), low = 0, hzSamples = [], lastF = 0;
const lowPower = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) || (navigator.deviceMemory && navigator.deviceMemory <= 2);
if (lowPower) { autoLite = true; liteReason = 'low-power device'; }
function perfStatus() { return `${lite ? 'Lite' : 'Full'} effects · ${Math.round(fps)} fps${lite && S.effects === 'auto' && liteReason ? ` (auto: ${liteReason})` : ''}`; }
function frame(t) {
  frames++;
  if (lastF && hzSamples.length < 90) { const dt = t - lastF; if (dt > 4 && dt < 60) hzSamples.push(dt); if (hzSamples.length === 90) { hzSamples.sort((a, b) => a - b); const med = hzSamples[45]; const hz = 1000 / med; DET.hz = [24, 30, 48, 50, 60, 75, 90, 100, 120, 144, 165, 240].reduce((a, b) => Math.abs(b - hz) < Math.abs(a - hz) ? b : a); const n = $('#v-hz'); if (n) n.textContent = `≈ ${DET.hz} Hz`; } }
  lastF = t;
  if (t - last >= 1000) {
    fps = frames * 1000 / (t - last); frames = 0; last = t;
    $('#fps').textContent = Math.round(fps) + ' fps';
    const target = DET.hz ? Math.min(60, DET.hz) : 60;
    if (S.effects === 'auto' && !autoLite && performance.now() > 4000 && !document.hidden) {
      if (fps < target * 0.75) low++; else low = Math.max(0, low - 1);
      if (low >= 3) { autoLite = true; liteReason = 'frame rate dropped'; applySettings(); toast('Effects reduced to keep things smooth', 'gauge'); }
    }
    const p = $('#v-perfnow'); if (p) p.textContent = perfStatus();
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); frames = 0; lastF = 0; });

/* =====================================================================
   BOOT
   ===================================================================== */
const bootStart = performance.timeOrigin ? 0 : performance.now();
let bootMs = 0;
applySettings();
setWallpaper(S.wallpaper);
tick();
renderHome();
SCREENS.home.el.classList.add('active'); SCREENS.home.el.removeAttribute('inert');
ensureFocus();
bootMs = Math.round(performance.now() - bootStart);
requestAnimationFrame(frame);
bumpIdle();
setInterval(() => { if (!(curScreen === 'game' && G.run) && !isAmbient()) ensureFocus(); }, 800);
window.__lumora = {S, F, get screen() { return curScreen; }, layers, ST, SET, get bootMs() { return bootMs; }};
})();
</script>
