<!doctype html>
<html lang="en" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Lumora OS — a concept smart-TV interface. Not affiliated with any TV platform or streaming service.">
<title>Lumora OS</title>
<style>
/* =========================================================================
   Lumora OS 2030 — concept TV interface.
   Drawn on a 120rem x 67.5rem canvas so it scales identically at 720p,
   1080p and 4K. Only transform and opacity are animated.
   ========================================================================= */
:root{
  --spring:cubic-bezier(.3,1.35,.55,1);
  --spring-soft:cubic-bezier(.25,1.1,.4,1);
  --out:cubic-bezier(.16,1,.3,1);
  --ts:1; --rs:1; --blur:2.4rem; --sat:180%;
  --home-tw:17.5rem;
  --font:system-ui,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --accent:#e9ebf0; --glow-o:.55; --dim:0; --clock-w:200;
}
@supports (transition-timing-function:linear(0,1)){
  :root{
    --spring:linear(0,.0459,.1556,.2958,.4431,.5823,.7046,.806,.8857,.9451,.9868,1.0139,1.0296,1.0369,1.0383,1.0359,1.0314,1.0259,1.0203,1.015,1.0105,1.0068,1.0039,1.0017,1.0003,.9993,.9988,.9986,.9985,.9986,.9988,.999,1);
    --spring-soft:linear(0,.063,.1991,.3555,.5042,.6324,.7361,.8163,.8761,.9191,.9491,.9695,.9828,.9912,.9963,.9992,1.0007,1.0014,1.0015,1.0014,1.0012,1.001,1.0008,1.0006,1);
  }
}
.theme-dark{
  --bg:#030305; --fg:#f5f5f7; --fg2:rgba(245,245,247,.62); --fg3:rgba(245,245,247,.4);
  --glass:rgba(255,255,255,.06); --glass-strong:rgba(22,22,28,.72); --glass-solid:#16161b;
  --chip:rgba(255,255,255,.08); --chip-sel:rgba(255,255,255,.17); --stroke:rgba(255,255,255,.1);
  --rim:rgba(255,255,255,.4); --rim2:rgba(255,255,255,.06);
  --focus-bg:#f5f5f7; --focus-fg:#050507; --shadow:rgba(0,0,0,.6);
  --veil:#000; --veil-home:.05; --veil-app:.6;
}
.theme-light{
  --bg:#e9eaee; --fg:#0c0d12; --fg2:rgba(12,13,18,.62); --fg3:rgba(12,13,18,.42);
  --glass:rgba(255,255,255,.42); --glass-strong:rgba(250,250,252,.82); --glass-solid:#f3f4f7;
  --chip:rgba(12,13,18,.06); --chip-sel:rgba(12,13,18,.13); --stroke:rgba(12,13,18,.09);
  --rim:rgba(255,255,255,.95); --rim2:rgba(255,255,255,.3);
  --focus-bg:#0c0d12; --focus-fg:#fff; --shadow:rgba(20,25,40,.3);
  --veil:#f2f3f6; --veil-home:.42; --veil-app:.74;
}
.hc.theme-dark{--fg2:#fff;--fg3:#e6e6e6;--glass:#000;--glass-strong:#000;--glass-solid:#000;--chip:#1c1c1c;--chip-sel:#3a3a3a;--stroke:#fff;--veil-app:.92;--veil-home:.4}
.hc.theme-light{--fg2:#000;--fg3:#1a1a1a;--glass:#fff;--glass-strong:#fff;--glass-solid:#fff;--chip:#e2e2e2;--chip-sel:#c4c4c4;--stroke:#000;--veil-app:.95;--veil-home:.7}
.glass-clear{--blur:1.2rem;--sat:150%}
.glass-clear.theme-dark{--glass:rgba(255,255,255,.035)}
.corners-soft{--rs:.55}.corners-xround{--rs:1.45}
.icons-compact{--home-tw:15rem}.icons-large{--home-tw:20rem}

*{box-sizing:border-box}
html{font-size:max(7px,min(calc(100vw / 120),calc(100vh / 67.5)));height:100%;background:var(--bg)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  font-size:calc(1.5rem * var(--ts));line-height:1.35;letter-spacing:-.005em}
.kbd body,.kbd *{cursor:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
[data-f]{outline:none}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- wallpaper + ambient app light ---------- */
#wall{position:fixed;inset:0;overflow:hidden;z-index:0}
#wall-inner{position:absolute;inset:-5%;transition:transform 1s var(--spring-soft)}
.wp{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity 1s ease}
.wp.on{opacity:1}
.wp i{position:absolute;display:block;will-change:transform}
.wp-liquid{background:radial-gradient(120% 90% at 50% 0%,#15161c 0%,#07070a 55%,#020203 100%)}
.wp-liquid .b1{width:70vmax;height:70vmax;left:-18vmax;top:-26vmax;background:radial-gradient(closest-side,rgba(210,215,230,.16),rgba(210,215,230,0));animation:dr1 38s ease-in-out infinite alternate}
.wp-liquid .b2{width:60vmax;height:60vmax;right:-16vmax;top:6vmax;background:radial-gradient(closest-side,rgba(140,160,200,.14),rgba(140,160,200,0));animation:dr2 46s ease-in-out infinite alternate}
.wp-liquid .b3{width:80vmax;height:50vmax;left:10vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(255,255,255,.08),rgba(255,255,255,0));animation:dr3 52s ease-in-out infinite alternate}
@keyframes dr1{to{transform:translate3d(26vw,14vh,0) scale(1.2)}}
@keyframes dr2{to{transform:translate3d(-24vw,18vh,0) scale(.85)}}
@keyframes dr3{to{transform:translate3d(-14vw,-12vh,0) scale(1.15)}}
.wp-horizon{background:radial-gradient(80% 60% at 50% 100%,#0a1a33 0%,#03060d 55%,#000 100%)}
.wp-horizon .planet{width:190vw;height:190vw;left:50%;margin-left:-95vw;top:64vh;border-radius:50%;background:radial-gradient(closest-side,#02040a 96%,#0b1830 99%,#5d8fd6 100%);box-shadow:0 -1.2vh 6vh rgba(90,140,230,.35)}
.wp-horizon .atmo{left:-10%;right:-10%;top:42vh;height:40vh;background:radial-gradient(50% 60% at 50% 100%,rgba(110,160,255,.28),transparent 70%);animation:atmo 14s ease-in-out infinite alternate}
.wp-horizon .sun{width:30vw;height:30vw;left:50%;margin-left:-15vw;top:49vh;background:radial-gradient(closest-side,rgba(235,242,255,.65),rgba(160,195,255,.15) 40%,transparent 70%);animation:rise 40s ease-in-out infinite alternate}
.wp-horizon .stars{inset:0;opacity:.6}
@keyframes atmo{to{opacity:.6;transform:scale(1.05)}}
@keyframes rise{from{transform:translate3d(-12vw,4vh,0) scale(.85)}to{transform:translate3d(12vw,-1vh,0) scale(1.05)}}
.wp-nocturne{background:linear-gradient(170deg,#070b18 0%,#04060d 60%,#010103 100%)}
.wp-nocturne .beam{width:28vw;height:200vh;top:-50vh;background:linear-gradient(90deg,transparent,rgba(160,180,255,.09),transparent);transform:rotate(24deg)}
.wp-nocturne .k1{left:10vw;animation:beam 22s ease-in-out infinite alternate}
.wp-nocturne .k2{left:46vw;animation:beam 30s ease-in-out -8s infinite alternate;opacity:.7}
.wp-nocturne .k3{left:78vw;animation:beam 26s ease-in-out -14s infinite alternate;opacity:.5}
@keyframes beam{from{transform:rotate(24deg) translate3d(-8vw,0,0)}to{transform:rotate(24deg) translate3d(10vw,0,0)}}
.wp-aurora{background:linear-gradient(180deg,#020706 0%,#04110f 60%,#010202 100%)}
.wp-aurora .a1{width:120vw;height:50vh;left:-10vw;top:6vh;background:radial-gradient(50% 50% at 50% 50%,rgba(60,220,170,.22),transparent 70%);animation:aur 24s ease-in-out infinite alternate}
.wp-aurora .a2{width:90vw;height:40vh;left:20vw;top:16vh;background:radial-gradient(50% 50% at 50% 50%,rgba(40,180,150,.16),transparent 70%);animation:aur 31s ease-in-out -10s infinite alternate-reverse}
@keyframes aur{to{transform:translate3d(-8vw,4vh,0) scale(1.15,1.3)}}
.wp-still{background-size:cover;background-position:center}
.reduce-motion .wp *,.lite .wp *,.wp-paused .wp *{animation-play-state:paused!important}

#glow{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s ease}
.on-home #glow{opacity:var(--glow-o)}
.ambient #glow{opacity:calc(var(--glow-o) * .5)}
#glow i{position:absolute;inset:0;opacity:0;transition:opacity .7s ease}
#glow i.on{opacity:1}
.glow-off #glow{display:none}

#veil{position:fixed;inset:0;z-index:1;background:var(--veil);opacity:calc(var(--veil-home) + var(--dim));transition:opacity .5s ease;pointer-events:none}
.on-app #veil{opacity:var(--veil-app)}
.on-wall #veil{opacity:var(--dim)}
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,transparent 26%,transparent 52%,rgba(0,0,0,.5) 100%);transition:opacity .5s}
.theme-light #scrim{background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,transparent 26%,transparent 52%,rgba(255,255,255,.4) 100%)}
.on-app #scrim{opacity:0}

/* ---------- liquid glass ---------- */
.lg,.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  box-shadow:inset 0 1px 0 var(--rim2),0 2.4rem 5rem rgba(0,0,0,.28)}
.lg::before,.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:0;
  background:linear-gradient(160deg,var(--rim),rgba(255,255,255,.04) 32%,rgba(255,255,255,0) 60%,rgba(255,255,255,.16));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass-strong{position:relative;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat));border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--rim2),0 3rem 6rem rgba(0,0,0,.4)}
.lite .lg,.lite .glass,.lite .glass-strong,.no-transp .lg,.no-transp .glass,.no-transp .glass-strong,.glass-solid .lg,.glass-solid .glass,.glass-solid .glass-strong,.hc .lg,.hc .glass,.hc .glass-strong
  {-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--glass-solid)}

/* ---------- screens ---------- */
#screens{position:fixed;inset:0;z-index:2}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(1.035);
  transition:opacity .32s ease,transform .6s var(--spring-soft),visibility 0s linear .6s}
.screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .32s ease,transform .6s var(--spring-soft),visibility 0s}
.reduce-motion .screen{transform:none!important}

/* ---------- generic focusables ---------- */
.fx{position:relative;isolation:isolate;transition:transform .42s var(--spring)}
.fx::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--chip);z-index:-2}
.fx::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--focus-bg);opacity:0;z-index:-1;transition:opacity .16s ease;box-shadow:0 1.2rem 2.6rem var(--shadow)}
.fx.focused{color:var(--focus-fg);transform:scale(1.045)}
.fx.focused::after{opacity:1}
.fx.plain::before{background:transparent}
.fx.sel:not(.focused)::before{background:var(--chip-sel)}
.reduce-motion .fx.focused{transform:none}
.hc .fx.focused::after{box-shadow:0 0 0 .3rem var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.8rem;min-height:4.6rem;padding:0 2.4rem;border-radius:calc(2.3rem * var(--rs));font-size:calc(1.4rem * var(--ts));font-weight:600;white-space:nowrap}
.btn.primary::before{background:var(--chip-sel)}
.btn .i{font-size:1.5em}
.icon-btn{width:4.6rem;height:4.6rem;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.icon-btn .i{font-size:2.1rem}
.icon-btn.plain::before{background:transparent}
[aria-disabled="true"]{opacity:.38}
.bump-left{animation:bl .32s var(--out)}.bump-right{animation:br .32s var(--out)}
.bump-up{animation:bu .32s var(--out)}.bump-down{animation:bd .32s var(--out)}
@keyframes bl{30%{translate:-.6rem 0}}@keyframes br{30%{translate:.6rem 0}}
@keyframes bu{30%{translate:0 -.6rem}}@keyframes bd{30%{translate:0 .6rem}}
.reduce-motion [class*="bump-"]{animation:none}

/* ---------- tiles ---------- */
.tile{position:relative;flex:0 0 auto;width:var(--tw,17.5rem);--px:0;--py:0;--s:1;--ly:0rem;--glow:#ffffff}
.t-lift{position:relative;transform:perspective(60rem) translate3d(0,var(--ly),0) scale(var(--s)) rotateX(calc(var(--py) * -14deg)) rotateY(calc(var(--px) * 16deg));
  transition:transform .55s var(--spring);will-change:transform}
.tile.focused{--s:1.12;--ly:-.5rem;z-index:3}
.tile.tracking .t-lift{transition:transform .14s linear}
.t-shadow{position:absolute;inset:8% 6% -2%;border-radius:calc(1.6rem * var(--rs));box-shadow:0 2rem 4rem var(--shadow);opacity:0;transition:opacity .3s ease}
@supports (color:color-mix(in srgb,red 50%,blue)){.t-shadow{box-shadow:0 1.8rem 4.4rem color-mix(in srgb,var(--glow) 45%,transparent),0 1.4rem 2.4rem rgba(0,0,0,.45)}}
.tile.focused .t-shadow{opacity:1}
.t-card{position:relative;aspect-ratio:var(--ar,5/3);border-radius:calc(1.6rem * var(--rs));overflow:hidden;isolation:isolate;background:#111;
  box-shadow:0 .6rem 1.4rem rgba(0,0,0,.3);transform:translateZ(0)}
.t-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 42%);pointer-events:none}
.t-rim{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.07);pointer-events:none;z-index:2}
.t-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:translate3d(calc(var(--px) * 1rem),calc(var(--py) * 1rem),0);transition:transform .55s var(--spring)}
.t-art img{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover}
.t-logo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:1rem}
.t-logo svg{width:4.6rem;height:4.6rem;fill:currentColor}
.t-logo.solo svg{width:5.6rem;height:5.6rem}
.t-logo.wide svg{width:12rem;height:3.9rem}
.t-logo.bbc svg{width:7.4rem;height:2.2rem}
.t-logo.bbc .t-word{font-size:calc(1.9rem * var(--ts));margin-top:.2rem}
.d-icon .t-logo.wide svg,.hero .big .t-logo.wide svg{width:20rem;height:6.5rem}
.d-icon .t-logo.bbc svg,.hero .big .t-logo.bbc svg{width:12rem;height:3.6rem}
.t-logo.sys svg.i{width:4.2rem;height:4.2rem;fill:none;stroke-width:1.5}
.t-word{font-weight:700;font-size:calc(1.5rem * var(--ts));letter-spacing:-.01em;line-height:1;color:#fff}
.t-wm{font-weight:800;font-size:calc(2.3rem * var(--ts));letter-spacing:-.02em;line-height:1.02;color:#fff;padding:0 1.2rem}
.t-wm.sm{font-size:calc(1.75rem * var(--ts))}
.t-wm em{font-style:normal}
.t-spec{position:absolute;inset:-50%;background:radial-gradient(closest-side,rgba(255,255,255,.3),transparent);opacity:0;
  transform:translate3d(calc(var(--px) * 40%),calc(var(--py) * 40%),0);transition:opacity .3s,transform .55s var(--spring);z-index:1;pointer-events:none}
.tile.focused .t-spec{opacity:.55}
.t-glint{position:absolute;top:-20%;bottom:-20%;left:0;width:55%;z-index:3;background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 70%,transparent 100%);
  transform:translate3d(-120%,0,0) skewX(-12deg);opacity:0;pointer-events:none}
.tile.focused .t-glint{animation:glint 1s var(--out) .06s 1 both}
@keyframes glint{0%{transform:translate3d(-120%,0,0) skewX(-12deg);opacity:1}100%{transform:translate3d(260%,0,0) skewX(-12deg);opacity:1}}
.t-ring{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .2rem rgba(255,255,255,.8);opacity:0;transition:opacity .2s;z-index:3}
.tile.focused .t-ring{opacity:1}
.hc .tile.focused .t-ring{box-shadow:inset 0 0 0 .4rem #fff,0 0 0 .3rem #000}
.t-title{margin-top:1rem;text-align:center;font-size:calc(1.3rem * var(--ts));font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translate3d(0,-.4rem,0);transition:opacity .2s,transform .4s var(--spring)}
.tile.focused .t-title,.tile.show-title .t-title,.names-always #home-stack .t-title{opacity:1;transform:translate3d(0,.3rem,0)}
.t-sub{display:block;font-weight:500;color:var(--fg2);font-size:calc(1.1rem * var(--ts));overflow:hidden;text-overflow:ellipsis}
.t-badge{position:absolute;top:.8rem;right:.8rem;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(255,255,255,.92);color:#0a0c12;display:flex;align-items:center;justify-content:center;font-size:1.4rem;z-index:4;box-shadow:0 .2rem .6rem rgba(0,0,0,.3)}
.t-badge .i{stroke-width:3}
.t-lock{position:absolute;top:.8rem;left:.8rem;width:2.4rem;height:2.4rem;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;z-index:4}
.t-prog{position:absolute;left:1rem;right:1rem;bottom:1rem;height:.5rem;border-radius:.3rem;background:rgba(0,0,0,.35);overflow:hidden;z-index:4}
.t-prog b{position:absolute;inset:0;background:#fff;transform-origin:0 50%;transform:scaleX(0);transition:transform .12s linear}
.tile.moving .t-lift{animation:jiggle .28s ease-in-out infinite alternate}
.tile.moving{--s:1.14}
@keyframes jiggle{from{transform:perspective(60rem) translate3d(0,-.5rem,0) scale(1.14) rotate(-1.4deg)}to{transform:perspective(60rem) translate3d(0,-.5rem,0) scale(1.14) rotate(1.4deg)}}
.reduce-motion .tile{--px:0!important;--py:0!important}
.reduce-motion .tile.focused{--s:1.05;--ly:0rem}
.reduce-motion .t-glint,.reduce-motion .t-spec{display:none}
.reduce-motion .t-lift,.reduce-motion .t-art{transition:transform .2s ease}
.reduce-motion .tile.moving .t-lift{animation:none}
.lite .t-shadow{display:none}

.track{position:relative;display:flex;gap:2.2rem;overflow-x:auto;overflow-y:hidden;padding:1.6rem 6rem 3.4rem;margin-bottom:-2.4rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar,.vscroll::-webkit-scrollbar{display:none}
.row-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 6rem;font-size:calc(1.45rem * var(--ts));font-weight:650;color:var(--fg2)}
.row-h .hint{font-size:calc(1.1rem * var(--ts));font-weight:500;color:var(--fg3)}
.vscroll{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}

/* ---------- HOME ---------- */
#s-home .topbar{position:absolute;top:3.2rem;left:6rem;right:6rem;display:flex;align-items:center;justify-content:space-between;z-index:3;transition:opacity .5s,transform .6s var(--spring-soft)}
.brand{display:flex;align-items:center;gap:1rem;font-weight:650;font-size:calc(1.6rem * var(--ts));letter-spacing:.01em;opacity:.9}
.brand .logo{width:3rem;height:3rem}
.status{display:flex;align-items:center;gap:.6rem;padding:.5rem;border-radius:3rem}
.status>*{position:relative;z-index:1}
.status .stime{padding:0 1.2rem 0 1.4rem;font-weight:600;font-size:calc(1.35rem * var(--ts));font-variant-numeric:tabular-nums}
.clock-wrap{position:absolute;left:6rem;top:10rem;transform-origin:0 0;transition:opacity .45s ease,transform .7s var(--spring-soft)}
.clock{font-size:calc(10.5rem * min(var(--ts),1.1));font-weight:var(--clock-w);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.clock .ampm{font-size:.28em;font-weight:400;letter-spacing:0;margin-left:.6rem;opacity:.7}
.date{font-size:calc(2rem * var(--ts));font-weight:500;margin-top:1rem;opacity:.9}
.clock-small .clock{font-size:calc(5.4rem * min(var(--ts),1.1))}
.clock-small .date{font-size:calc(1.6rem * var(--ts));margin-top:.5rem}
.clock-hidden .clock-wrap{display:none}
.status .stime{display:none}
.clock-hidden .status .stime{display:block}
.home-shifted .clock-wrap{opacity:0;transform:translate3d(0,-5rem,0) scale(.94)}
.shelf-info{position:absolute;left:6rem;right:6rem;top:32.4rem;height:6rem;display:flex;align-items:flex-end;justify-content:space-between;transition:opacity .4s ease,transform .6s var(--spring-soft)}
.home-shifted .shelf-info{opacity:0;transform:translate3d(0,-3rem,0)}
.si-main{display:flex;align-items:center;gap:1.4rem;min-width:0}
.si-dot{width:1rem;height:1rem;border-radius:50%;background:var(--si-c,#fff);box-shadow:0 0 1.4rem var(--si-c,#fff);flex:0 0 auto}
.si-text{min-width:0;transition:opacity .25s ease,transform .45s var(--spring)}
.si-text.swap{opacity:0;transform:translate3d(0,.8rem,0)}
.si-name{font-size:calc(2.4rem * var(--ts));font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.si-sub{font-size:calc(1.25rem * var(--ts));color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-hint{font-size:calc(1.1rem * var(--ts));color:var(--fg3);white-space:nowrap;padding-bottom:.3rem}
#home-stack{position:absolute;left:0;right:0;top:39.4rem;transition:transform .65s var(--spring-soft)}
#home-stack .tile{--tw:var(--home-tw)}
.hrow{padding-bottom:.6rem;transition:opacity .35s ease}
.hrow.above{opacity:0;pointer-events:none}
.dock{margin:0 3.6rem;border-radius:calc(3rem * var(--rs))}
.dock .track{padding:1.8rem 2.4rem 1.2rem;margin-bottom:0;border-radius:inherit}
.dock .t-title{margin-top:.8rem}
.shelf-min .dock{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
.shelf-min .dock::before{display:none}
.no-games [data-hrow="games"]{display:none}
.hrow-games{margin-top:1.6rem}
.ambient #s-home .topbar,.ambient #home-stack,.ambient .shelf-info{opacity:0;transform:translate3d(0,4rem,0);pointer-events:none}
.ambient #home-stack{transition:opacity .6s,transform .8s var(--spring-soft)}
.ambient .clock-wrap{display:block!important;opacity:1!important;transform:translate3d(0,14rem,0) scale(1.2)!important}
.ambient #toast{opacity:0}

/* ---------- launch ---------- */
#zoom{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:40;transform-origin:0 0;opacity:0;pointer-events:none;border-radius:1.6rem;overflow:hidden}
#s-launch .launch-bg{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 100%,var(--glow),transparent 70%),#000;opacity:.6}
#s-launch .launch-card{position:absolute;left:50%;top:50%;width:76rem;transform:translate(-50%,-50%);border-radius:calc(3rem * var(--rs));padding:4.2rem 5rem;text-align:center}
.launch-card .l-icon{--tw:18rem;margin:0 auto 2.4rem}
.launch-card h1{margin:0;font-size:calc(3.8rem * var(--ts));letter-spacing:-.02em}
.launch-card .host{margin:.6rem 0 0;font-size:calc(1.5rem * var(--ts));color:var(--fg2)}
.launch-card .msg{margin:2rem auto 0;max-width:60rem;font-size:calc(1.45rem * var(--ts));color:var(--fg2)}
.launch-card .actions{display:flex;justify-content:center;gap:1.4rem;margin-top:2.8rem;flex-wrap:wrap}
.safe-note{display:flex;gap:.8rem;align-items:center;justify-content:center;margin-top:2.4rem;font-size:calc(1.2rem * var(--ts));color:var(--fg3)}

/* ---------- headers ---------- */
.scr-head{position:absolute;top:3.2rem;left:6rem;right:6rem;height:5rem;display:flex;align-items:center;justify-content:space-between;z-index:3}
.scr-title{display:flex;align-items:center;gap:1rem;font-size:calc(2rem * var(--ts));font-weight:700;letter-spacing:-.01em}
.scr-title .i{font-size:2.6rem}
.tabs{display:flex;gap:.6rem;padding:.5rem;border-radius:3rem;transition:opacity .3s}
.tabs>*{z-index:1}
.tab{padding:0 2.2rem;height:4rem;border-radius:2rem;display:flex;align-items:center;font-weight:600;font-size:calc(1.4rem * var(--ts))}
.tab::before{background:transparent}
.tab.sel:not(.focused)::before{background:var(--chip-sel)}
.head-spacer{min-width:12rem;display:flex;justify-content:flex-end;white-space:nowrap}

/* ---------- STORE ---------- */
.st-body{position:absolute;left:0;right:0;top:10rem;bottom:0}
.pane{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translate3d(3rem,0,0);transition:opacity .28s ease,transform .5s var(--spring-soft),visibility 0s linear .5s}
.pane.on{opacity:1;visibility:visible;transform:none;transition:opacity .28s ease,transform .5s var(--spring-soft),visibility 0s}
.pane.left{transform:translate3d(-3rem,0,0)}
.pane.vscroll{padding-bottom:6rem}
.hero{position:relative;margin:1.8rem 6rem 1rem;height:30rem;border-radius:calc(2.6rem * var(--rs));transition:transform .5s var(--spring)}
.hero .slides{position:absolute;inset:0;border-radius:inherit;overflow:hidden;isolation:isolate;transform:translateZ(0);background:#08080b}
.hero .slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;background:radial-gradient(60% 90% at 78% 50%,var(--glow),transparent 70%),linear-gradient(90deg,#060608 30%,transparent)}
.hero .slide.on{opacity:1}
.hero .slide .big{position:absolute;right:9rem;top:50%;transform:translateY(-50%)}
.hero .slide .big .tile{--tw:30rem}
.hero .copy{position:absolute;left:4.4rem;top:50%;transform:translateY(-50%);max-width:52rem;color:#fff}
.hero .kicker{font-size:calc(1.15rem * var(--ts));font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.hero h2{margin:.6rem 0 .6rem;font-size:calc(4rem * var(--ts));letter-spacing:-.025em;line-height:1.05}
.hero p{margin:0;font-size:calc(1.45rem * var(--ts));opacity:.8}
.hero .cta{margin-top:2rem;display:inline-flex;align-items:center;gap:.8rem;height:4.4rem;padding:0 2.2rem;border-radius:2.2rem;background:rgba(255,255,255,.16);font-weight:650}
.hero.focused{transform:scale(1.015)}
.hero.focused .cta{background:#fff;color:#0a0c12}
.hero .ring{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .22rem rgba(255,255,255,.8);opacity:0;transition:opacity .2s}
.hero.focused .ring{opacity:1}
.hero .dots{position:absolute;right:3rem;bottom:2.4rem;display:flex;gap:.8rem}
.hero .dots i{width:.8rem;height:.8rem;border-radius:50%;background:#fff;opacity:.3;transition:opacity .3s,transform .3s var(--spring)}
.hero .dots i.on{opacity:1;transform:scale(1.25)}
.hero .arrows{position:absolute;left:4.4rem;bottom:2.4rem;font-size:calc(1.15rem * var(--ts));color:rgba(255,255,255,.7);opacity:0;transition:opacity .3s}
.hero.focused .arrows{opacity:1}
.reduce-motion .hero.focused{transform:none}
.st-row{margin-top:1.4rem}
.st-row .tile{--tw:16rem}
.st-row .t-title,.grid .t-title{opacity:1;transform:none}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:2.6rem;padding:2.2rem 6rem}
.cat{height:15rem;border-radius:calc(2.2rem * var(--rs));display:flex;flex-direction:column;justify-content:flex-end;padding:2.2rem 2.6rem;overflow:hidden;text-align:left}
.cat .i{position:absolute;right:2.4rem;top:2.2rem;font-size:4.6rem;opacity:.85;stroke-width:1.4}
.cat b{font-size:calc(2.3rem * var(--ts));letter-spacing:-.015em}
.cat span{font-size:calc(1.2rem * var(--ts));opacity:.7}
.list-head{display:flex;align-items:center;gap:1.4rem;padding:1.6rem 6rem 0;font-size:calc(3rem * var(--ts));font-weight:700;letter-spacing:-.015em}
.list-head .i{font-size:3.2rem}
.list-head small{font-size:calc(1.4rem * var(--ts));font-weight:500;color:var(--fg2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,16rem);gap:2.2rem 2.4rem;padding:2rem 6rem 4rem;justify-content:start}
.grid .tile{--tw:16rem}
.search{display:grid;grid-template-columns:44rem 1fr;gap:4rem;padding:1.6rem 6rem 0;height:100%}
.qbox{height:6rem;border-radius:calc(1.8rem * var(--rs));display:flex;align-items:center;gap:1.2rem;padding:0 2rem;font-size:calc(2rem * var(--ts));margin-bottom:2rem}
.qbox>*{z-index:1}
.qbox .q{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbox .q:empty::before{content:attr(data-ph);color:var(--fg3)}
.caret{width:.2rem;height:2.6rem;background:var(--fg);animation:blink 1s steps(2) infinite;flex:0 0 auto}
@keyframes blink{50%{opacity:0}}
.reduce-motion .caret{animation:none}
.kb{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem}
.key{height:5.4rem;border-radius:calc(1.3rem * var(--rs));display:flex;align-items:center;justify-content:center;font-size:calc(1.8rem * var(--ts));font-weight:600}
.kb .key{text-transform:uppercase}
.key.w2{grid-column:span 2;font-size:calc(1.3rem * var(--ts));text-transform:none}
.key .i{font-size:2.2rem}
.results{min-width:0;height:100%}
.results .grid{padding:0 0 6rem;grid-template-columns:repeat(auto-fill,15rem)}
.results .grid .tile{--tw:15rem}
.res-h{font-size:calc(1.45rem * var(--ts));font-weight:650;color:var(--fg2);margin:.4rem 0 1.4rem}
.empty{color:var(--fg2);font-size:calc(1.5rem * var(--ts));padding:2rem 0}
.detail{padding:1.4rem 6rem 6rem}
.d-top{display:grid;grid-template-columns:30rem 1fr;gap:4.4rem;align-items:center}
.d-icon{--tw:30rem}
.d-icon .t-logo svg{width:7rem;height:7rem}
.d-icon .t-wm{font-size:calc(3.4rem * var(--ts))}
.d-name{margin:0;font-size:calc(4rem * var(--ts));letter-spacing:-.025em;line-height:1.05}
.d-dev{margin:.6rem 0 0;font-size:calc(1.45rem * var(--ts));color:var(--fg2)}
.chips{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.8rem}
.chip{display:inline-flex;align-items:center;gap:.6rem;height:3.4rem;padding:0 1.4rem;border-radius:1.7rem;background:var(--chip);font-size:calc(1.2rem * var(--ts));font-weight:600;white-space:nowrap}
.chip .i{font-size:1.5rem}
.stars{display:inline-flex;gap:.15rem;color:var(--fg)}
.stars .i{fill:currentColor;stroke:none}
.stars .i.off{opacity:.25}
.d-actions{display:flex;gap:1.4rem;margin-top:2.4rem;flex-wrap:wrap}
.install{min-width:20rem;overflow:hidden}
.install .pbar{position:absolute;inset:0;border-radius:inherit;background:var(--glow,#888);opacity:.6;transform-origin:0 50%;transform:scaleX(0);z-index:0;transition:transform .12s linear}
.install .lbl,.install .i{position:relative;z-index:1}
.install:not(.busy) .pbar{opacity:0}
.d-sec{margin-top:3.4rem}
.d-sec h3{margin:0 0 .4rem;font-size:calc(1.5rem * var(--ts));color:var(--fg2);font-weight:650}
.d-sec .track{margin:0 -1rem;padding:1.6rem 1rem 1.2rem}
.shot{--tw:34rem;--ar:16/9}
.d-cols{display:grid;grid-template-columns:1.4fr 1fr;gap:3rem;margin-top:1.4rem}
.card{border-radius:calc(2rem * var(--rs));padding:2.4rem 2.8rem;font-size:calc(1.4rem * var(--ts));line-height:1.5}
.card>*{position:relative;z-index:1}
.card p{margin:0 0 1rem}.card p:last-child{margin:0}
.card h4{margin:0 0 1rem;font-size:calc(1.5rem * var(--ts))}
.bars{display:grid;gap:.7rem;margin-top:1rem}
.bar{display:grid;grid-template-columns:2rem 1fr;gap:1rem;align-items:center;font-size:calc(1.1rem * var(--ts))}
.bar span{height:.6rem;border-radius:.4rem;background:var(--chip);overflow:hidden;position:relative}
.bar span b{position:absolute;inset:0;background:currentColor;opacity:.7;transform-origin:0 50%}
.sim{font-size:calc(1.05rem * var(--ts));color:var(--fg3);margin-top:1rem}

/* ---------- SETTINGS ---------- */
.set-side{position:absolute;left:4rem;top:11rem;bottom:4rem;width:32rem;border-radius:calc(2.8rem * var(--rs));padding:1.6rem}
.set-side .vscroll{height:100%;position:relative;z-index:1}
.side-item{display:flex;width:100%;align-items:center;gap:1.4rem;height:5rem;padding:0 1.8rem;border-radius:calc(1.6rem * var(--rs));font-size:calc(1.45rem * var(--ts));font-weight:600;margin-bottom:.3rem}
.side-item::before{background:transparent}
.side-item.sel:not(.focused)::before{background:var(--chip-sel)}
.side-item .i{font-size:2.1rem}
.set-main{position:absolute;left:40rem;right:4rem;top:11rem;bottom:0;padding:0 2rem 6rem}
.set-panel{transition:opacity .25s ease,transform .45s var(--spring-soft)}
.set-panel.enter{opacity:0;transform:translate3d(2.4rem,0,0)}
.set-h{font-size:calc(3rem * var(--ts));font-weight:700;letter-spacing:-.02em;margin:.4rem 0 .4rem}
.set-lead{color:var(--fg2);font-size:calc(1.4rem * var(--ts));margin:0 0 1.8rem;max-width:72rem}
.group{margin:2.6rem 0 .8rem;font-size:calc(1.15rem * var(--ts));font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:2.4rem;min-height:6rem;padding:1.2rem 2.2rem;border-radius:calc(1.6rem * var(--rs));margin-bottom:.8rem}
.set-row .txt{min-width:0}
.set-row .lbl{font-size:calc(1.5rem * var(--ts));font-weight:600;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.set-row .sub{font-size:calc(1.2rem * var(--ts));color:var(--fg2);margin-top:.3rem}
.fx.focused .sub,.fx.focused .val,.fx.focused .t-sub{color:inherit;opacity:.72}
.set-row .val{font-size:calc(1.4rem * var(--ts));color:var(--fg2);white-space:nowrap;text-align:right}
.set-row .val .i{font-size:2.2rem}
.set-row.choice{background:transparent;padding-left:2.2rem;padding-right:0;flex-wrap:wrap;row-gap:1rem}
.set-row.choice .txt{flex:1 1 24rem}
.seg{display:flex;gap:.8rem;flex:0 1 auto;max-width:100%;justify-content:flex-end;flex-wrap:wrap}
.opt{height:4.4rem;padding:0 2rem;border-radius:2.2rem;display:inline-flex;align-items:center;gap:.6rem;font-size:calc(1.3rem * var(--ts));font-weight:600;white-space:nowrap}
.opt .i{font-size:1.5rem;stroke-width:3;display:none}
.opt.sel .i{display:inline-block}
.opt .sw{width:1.4rem;height:1.4rem;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.switch{position:relative;width:6rem;height:3.4rem;border-radius:1.7rem;flex:0 0 auto}
.switch::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(128,128,140,.45)}
.switch::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#34c77b;opacity:0;transition:opacity .2s}
.switch.on::after{opacity:1}
.switch i{position:absolute;left:.3rem;top:.3rem;width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;z-index:1;box-shadow:0 .2rem .6rem rgba(0,0,0,.3);transition:transform .45s var(--spring)}
.switch.on i{transform:translate3d(2.6rem,0,0)}
.badge{display:inline-flex;align-items:center;height:2.3rem;padding:0 1rem;border-radius:1.2rem;font-size:calc(1rem * var(--ts));font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;white-space:nowrap}
.badge.sim{background:rgba(255,190,90,.14);color:#ffc472;margin:0}
.badge.real{background:rgba(52,199,123,.16);color:#4fdb94}
.badge.mono{background:var(--chip);color:var(--fg2)}
.theme-light .badge.sim{color:#9a5600;background:rgba(255,150,0,.14)}
.theme-light .badge.real{color:#127a43}
.hc .badge{background:transparent!important;border:2px solid currentColor}
.fx.focused .badge{background:rgba(128,128,128,.25);color:inherit}
.note{display:flex;gap:1.2rem;align-items:flex-start;padding:1.6rem 2rem;border-radius:calc(1.6rem * var(--rs));background:var(--chip);font-size:calc(1.3rem * var(--ts));margin:1rem 0}
.note .i{font-size:2.2rem;margin-top:.1rem;color:var(--fg2)}
.det-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem 1.2rem}
.det-grid .set-row{margin:0}
.about-hero{display:flex;align-items:center;gap:2.6rem;padding:2.6rem 3rem;border-radius:calc(2.4rem * var(--rs));margin-bottom:1.4rem}
.about-hero>*{position:relative;z-index:1}
.about-hero .logo{width:8rem;height:8rem}
.about-hero h2{margin:0;font-size:calc(3.2rem * var(--ts));letter-spacing:-.025em}
.about-hero p{margin:.4rem 0 0;color:var(--fg2)}
.concept{box-shadow:inset 0 0 0 .2rem rgba(255,196,114,.6)}
.concept b{color:#ffc472}
.theme-light .concept b{color:#9a5600}
.mono-val .val{font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---------- WALLPAPERS app ---------- */
.wall-copy{position:absolute;left:6rem;top:14rem;max-width:60rem;transition:opacity .3s}
.wall-copy .kicker{font-size:calc(1.15rem * var(--ts));font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--fg2)}
.wall-copy h1{margin:.6rem 0 .8rem;font-size:calc(6rem * var(--ts));font-weight:300;letter-spacing:-.04em;line-height:1}
.wall-copy p{margin:0;font-size:calc(1.6rem * var(--ts));color:var(--fg2)}
.wall-copy .applied{margin-top:2rem;display:inline-flex;gap:.8rem;align-items:center;font-weight:600;font-size:calc(1.3rem * var(--ts))}
.wall-dock{position:absolute;left:3.6rem;right:3.6rem;bottom:3.6rem;border-radius:calc(3rem * var(--rs));padding-top:1.8rem}
.wall-dock .ctl{display:flex;gap:3rem;align-items:center;padding:0 2.4rem;position:relative;z-index:1;flex-wrap:wrap}
.wall-dock .ctl .lbl{font-size:calc(1.2rem * var(--ts));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-right:.4rem}
.wall-dock .ctl .grp{display:flex;align-items:center;gap:.8rem}
.wall-dock .track{padding:1.6rem 2.4rem 3.6rem;margin:0}
.wall-dock .tile{--tw:22rem;--ar:16/9}
.wall-dock .t-title{opacity:1;transform:none}

/* ---------- BROWSER ---------- */
.br-bar{position:absolute;top:3.2rem;left:4rem;right:4rem;height:7rem;border-radius:calc(3.5rem * var(--rs));display:flex;align-items:center;gap:.8rem;padding:0 1.2rem;z-index:3}
.br-bar>*{position:relative;z-index:1}
.url{flex:1;height:4.8rem;border-radius:2.4rem;display:flex;align-items:center;gap:1rem;padding:0 2rem;font-size:calc(1.45rem * var(--ts));min-width:0;justify-content:flex-start}
.url span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url .ph{color:var(--fg3)}
.url.focused .ph{color:inherit;opacity:.6}
.br-view{position:absolute;left:4rem;right:4rem;top:11.6rem;bottom:3.6rem}
#br-start{position:absolute;inset:0;padding:3rem 2rem 4rem}
.br-hello{text-align:center;margin:2rem 0 3rem}
.br-hello h1{margin:0;font-size:calc(4.4rem * var(--ts));font-weight:300;letter-spacing:-.035em}
.br-hello p{margin:.8rem 0 0;color:var(--fg2)}
.br-search{display:flex;align-items:center;gap:1.2rem;width:70rem;max-width:100%;height:6.4rem;margin:0 auto;border-radius:3.2rem;padding:0 2.6rem;font-size:calc(1.7rem * var(--ts))}
.br-search>*{position:relative;z-index:1}
.br-search .ph{color:var(--fg3)}
.br-search.focused .ph{color:inherit;opacity:.6}
.br-favs{display:grid;grid-template-columns:repeat(6,1fr);gap:2.4rem;max-width:108rem;margin:4rem auto 0;padding:0 1rem}
.br-favs .tile{--tw:100%}
.br-favs .t-title{opacity:1;transform:none}
#br-page{position:absolute;inset:0;border-radius:calc(2.4rem * var(--rs));overflow:hidden;background:#fff}
#br-page[hidden]{display:none}
#br-page.focused{box-shadow:0 0 0 .3rem var(--fg)}
#br-page iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.br-hint{position:absolute;left:50%;bottom:2rem;transform:translateX(-50%);display:flex;align-items:center;gap:1.4rem;padding:1rem 1rem 1rem 2rem;border-radius:3rem;font-size:calc(1.2rem * var(--ts));color:#fff;background:rgba(10,10,14,.78);white-space:nowrap;z-index:2}
.br-hint .btn{min-height:3.8rem;padding:0 1.8rem;font-size:calc(1.2rem * var(--ts))}
.br-hint .btn::before{background:rgba(255,255,255,.15)}

/* virtual cursor */
#vcursor{position:fixed;left:0;top:0;width:3.4rem;height:3.4rem;z-index:90;pointer-events:none;opacity:0;transition:opacity .2s;will-change:transform;overflow:visible}
.vcursor #vcursor{opacity:1}
#vcursor .ring{fill:none;stroke:#fff;stroke-width:2.5;opacity:0;transform-origin:6px 3px;transform:scale(.3)}
#vcursor.click .ring{animation:ripple .45s var(--out)}
@keyframes ripple{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1)}}
.vc-hint{position:fixed;top:1.6rem;left:50%;transform:translate3d(-50%,-8rem,0);opacity:0;z-index:89;padding:.9rem 2rem;border-radius:2rem;font-size:calc(1.2rem * var(--ts));font-weight:600;transition:transform .5s var(--spring);pointer-events:none}
.vcursor .vc-hint{transform:translate3d(-50%,0,0);opacity:1}
.vc-hint{transition:transform .5s var(--spring),opacity .25s}
.accent-fixed .tile{--glow:var(--accent)!important}
.theme-light #lg-logo stop:first-child{stop-color:#1c1e24}.theme-light #lg-logo stop:last-child{stop-color:#7d8392}

/* ---------- layers ---------- */
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
.layer .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s ease}
.layer.open .backdrop{opacity:1}
.layer .panel{position:relative;isolation:isolate;opacity:0;transform:translate3d(0,2.4rem,0) scale(.95);transition:opacity .22s ease,transform .55s var(--spring)}
.layer.open .panel{opacity:1;transform:none}
.layer.side{justify-content:flex-end}
.layer.side .panel{height:calc(100% - 4rem);margin-right:2rem;width:44rem;border-radius:calc(2.8rem * var(--rs));transform:translate3d(110%,0,0);opacity:1;padding:2.6rem 2rem;display:flex;flex-direction:column}
.layer.side.open .panel{transform:none}
.layer.sheet{align-items:flex-end}
.layer.sheet .panel{transform:translate3d(0,110%,0);opacity:1;margin-bottom:3rem}
.layer.sheet.open .panel{transform:none}
.reduce-motion .layer .panel{transform:none!important;transition:opacity .2s ease}
.reduce-motion .layer.side .panel,.reduce-motion .layer.sheet .panel{opacity:0}
.reduce-motion .layer.open .panel{opacity:1}
.panel-bg{position:absolute;inset:0;border-radius:inherit;z-index:-1}
.dlg{width:64rem;border-radius:calc(2.8rem * var(--rs));padding:3.6rem 4rem;text-align:center}
.dlg h2{margin:0;font-size:calc(2.5rem * var(--ts));letter-spacing:-.015em}
.dlg p{margin:1.2rem 0 0;color:var(--fg2);font-size:calc(1.4rem * var(--ts))}
.dlg .actions{display:flex;justify-content:center;gap:1.4rem;margin-top:2.8rem;flex-wrap:wrap}
.opts{border-radius:calc(2.6rem * var(--rs));padding:2.2rem;display:flex;gap:1.2rem;align-items:center}
.opts .who{font-weight:700;font-size:calc(1.6rem * var(--ts));padding:0 1.6rem 0 1rem}
.pin{width:48rem;padding:3.4rem 3.6rem 3rem}
.pdots{display:flex;justify-content:center;gap:2rem;margin:2.4rem 0 .6rem}
.pdots i{width:2rem;height:2rem;border-radius:50%;border:.2rem solid var(--fg);position:relative}
.pdots i::after{content:"";position:absolute;inset:.2rem;border-radius:50%;background:var(--fg);transform:scale(0);transition:transform .3s var(--spring)}
.pdots i.on::after{transform:scale(1)}
.pdots.shake{animation:shake .45s var(--out)}
@keyframes shake{20%{translate:-1.2rem 0}40%{translate:1rem 0}60%{translate:-.7rem 0}80%{translate:.4rem 0}}
.pin-msg{min-height:2.2rem;font-size:calc(1.25rem * var(--ts));color:#ff7a7a}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;margin-top:1.2rem}
.pad .key{height:6rem;font-size:calc(2.2rem * var(--ts))}
.pad .key.small{font-size:calc(1.3rem * var(--ts))}
.vk{width:104rem;border-radius:calc(3rem * var(--rs));padding:2.6rem 2.8rem 2.8rem}
.vk-top{display:flex;align-items:center;gap:1.4rem;margin-bottom:1.8rem}
.vk-title{display:flex;align-items:center;gap:.8rem;font-size:calc(1.2rem * var(--ts));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);white-space:nowrap}
.vk-title .i{font-size:2rem}
.vk-field{flex:1;height:5.6rem;border-radius:2.8rem;background:var(--chip);display:flex;align-items:center;gap:.4rem;padding:0 2.2rem;font-size:calc(1.9rem * var(--ts));min-width:0;overflow:hidden}
.vk-field .v{white-space:pre;overflow:hidden;min-width:0}
.vk-field .v:empty::before{content:attr(data-ph);color:var(--fg3)}
.vk-keys{display:grid;grid-template-columns:repeat(11,1fr);gap:.9rem}
.vk-keys .key{height:5.4rem}
.vk-keys .w2{grid-column:span 2;font-size:calc(1.3rem * var(--ts))}
.vk-keys .w3{grid-column:span 3;font-size:calc(1.3rem * var(--ts))}
.vk-keys .go::before{background:var(--chip-sel)}
.vk-keys .shift-on::before{background:var(--chip-sel)}
.qm-h{display:flex;align-items:center;gap:1rem;font-size:calc(2rem * var(--ts));font-weight:700;margin:0 1rem 1.6rem}
.qm-list{flex:1;min-height:0}
.qm-list .set-row{min-height:5.4rem}

/* ---------- assistant ---------- */
.layer.asst .panel{margin-bottom:3.4rem}
.asst-panel{display:flex;gap:3rem;align-items:center;width:100rem;border-radius:calc(3rem * var(--rs));padding:2.8rem 3.2rem}
.asst-panel>*{position:relative;z-index:1}
.orb{position:relative;width:10rem;height:10rem;flex:0 0 auto}
.orb i{position:absolute;inset:0;border-radius:50%;opacity:.55;transition:opacity .3s,transform .5s var(--spring)}
.orb i:nth-child(1){background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95),rgba(200,210,235,.35) 45%,transparent 70%)}
.orb i:nth-child(2){inset:-.8rem;background:radial-gradient(closest-side,transparent 70%,rgba(255,255,255,.22) 86%,transparent 100%)}
.orb i:nth-child(3){inset:-1.8rem;background:radial-gradient(closest-side,transparent 72%,rgba(255,255,255,.12) 88%,transparent 100%)}
.orb b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.2rem;color:#0a0b0f}
.orb b .i{stroke-width:2}
[data-state="listening"] .orb i{animation:orb 1.1s ease-in-out infinite alternate}
[data-state="listening"] .orb i:nth-child(2){animation-delay:.2s}[data-state="listening"] .orb i:nth-child(3){animation-delay:.4s}
[data-state="speaking"] .orb i{animation:orb .45s ease-in-out infinite alternate}
[data-state="thinking"] .orb i:nth-child(1){animation:orb .7s ease-in-out infinite alternate}
@keyframes orb{from{transform:scale(.92);opacity:.45}to{transform:scale(1.08);opacity:1}}
.reduce-motion .orb i{animation:none!important}
.asst-body{min-width:0;flex:1}
.asst-heard{font-size:calc(2.4rem * var(--ts));font-weight:650;letter-spacing:-.015em;line-height:1.2}
.asst-reply{font-size:calc(1.5rem * var(--ts));color:var(--fg2);margin-top:.6rem;min-height:2rem}
.asst-chips{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
.asst-chips .opt .i{display:inline-block;font-size:1.7rem;stroke-width:2}
#toast{position:fixed;left:50%;bottom:4.4rem;z-index:95;transform:translate3d(-50%,8rem,0);opacity:0;border-radius:3rem;padding:1.3rem 2.6rem;display:flex;align-items:center;gap:1rem;
  font-size:calc(1.35rem * var(--ts));font-weight:600;transition:opacity .25s,transform .55s var(--spring);pointer-events:none;max-width:96rem}
#toast.show{opacity:1;transform:translate3d(-50%,0,0)}
#toast .i{font-size:2rem;flex:0 0 auto}
#fps{position:fixed;top:1rem;right:1rem;z-index:96;font:600 1.2rem/1 ui-monospace,Menlo,Consolas,monospace;padding:.6rem .9rem;border-radius:.8rem;background:rgba(0,0,0,.6);color:#9dffb0;display:none}
.show-fps #fps{display:block}

#s-game .g-wrap{position:absolute;left:50%;top:53%;width:96rem;transform:translate(-50%,-50%)}
#s-game canvas{display:block;width:96rem;height:54rem;border-radius:calc(2rem * var(--rs));background:#050507}
.g-hud{display:flex;justify-content:space-between;font-size:calc(1.5rem * var(--ts));font-weight:650;margin-bottom:1.2rem;padding:0 .4rem}
.g-hud span{color:var(--fg2);font-weight:500}
.g-over{position:absolute;left:50%;top:calc(50% + 1.5rem);transform:translate(-50%,-50%);text-align:center;border-radius:calc(2.6rem * var(--rs));padding:3rem 4rem;transition:opacity .25s}
.g-over.off{opacity:0;pointer-events:none}
.g-over h2{margin:0 0 .6rem;font-size:calc(3rem * var(--ts))}
.g-over p{margin:0 0 2rem;color:var(--fg2)}
.g-over .actions{display:flex;gap:1.4rem;justify-content:center}
@media (prefers-reduced-motion:reduce){.wp *{animation-play-state:paused!important}}
</style>

  withPin(a, `Enter PIN to install ${a.name}`, () => {
    if (INST[id] || installed(id)) return;
    const start = performance.now(), dur = 2000 + Math.random() * 1400;
    INST[id] = {p: 0};
    const step = () => {
      const t = Math.min(1, (performance.now() - start) / dur);
      INST[id].p = t < 1 ? 1 - Math.pow(1 - t, 2.2) : 1;
      $$(`[data-install="${id}"]`).forEach(b => { b.classList.add('busy'); b.removeAttribute('data-act'); const pb = $('.pbar', b); if (pb) pb.style.transform = `scaleX(${INST[id].p})`; $('.lbl', b).textContent = `Installing ${Math.round(INST[id].p * 100)}%`; });
      $$(`.tile[data-app="${id}"] .t-prog b`).forEach(b => b.style.transform = `scaleX(${INST[id].p})`);
      if (t < 1) setTimeout(step, 60);
      else {
        delete INST[id];
        const list = a.cat === 'Games' ? S.games : S.apps;
        const at = list.indexOf('store'); if (at >= 0) list.splice(at, 0, id); else list.push(id);
        save(); renderHome(); storeRefresh(); toast(`${a.name} added to Home`);
      }
    };
    storeRefresh(); step();
  });
}

  activate(el);
  setTimeout(ensureFocus, 0);
});
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-f][data-hold]'); e.preventDefault();
  if (el && inScope(el) && !lpFired) { setFocus(el, {src: 'pointer'}); openOptions(el); }
});
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-f]'); if (el && el !== F.cur && inScope(el)) setFocus(el, {noScroll: true}); });
let wheelLock = 0;
$('#s-home').addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) < Math.abs(e.deltaX) || Math.abs(e.deltaY) < 8) return;
  const now = Date.now(); if (now - wheelLock < 350) return; wheelLock = now;
  move(e.deltaY > 0 ? 'down' : 'up');
}, {passive: true});

/* =====================================================================
   PERFORMANCE
   ===================================================================== */
let fps = 60, frames = 0, last = performance.now(), low = 0, hzSamples = [], lastF = 0;
const lowPower = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2) || (navigator.deviceMemory && navigator.deviceMemory <= 2);
if (lowPower) { autoLite = true; liteReason = 'low-power device'; }
function perfStatus() { return `${lite ? 'Lite' : 'Full'} effects · ${Math.round(fps)} fps${lite && S.effects === 'auto' && liteReason ? ` (auto: ${liteReason})` : ''}`; }
function frame(t) {
  frames++;
  if (lastF && hzSamples.length < 90) { const dt = t - lastF; if (dt > 4 && dt < 60) hzSamples.push(dt); if (hzSamples.length === 90) { hzSamples.sort((a, b) => a - b); const hz = 1000 / hzSamples[45]; DET.hz = [24, 30, 48, 50, 60, 75, 90, 100, 120, 144, 165, 240].reduce((a, b) => Math.abs(b - hz) < Math.abs(a - hz) ? b : a); const n = $('#v-hz'); if (n) n.textContent = `≈ ${DET.hz} Hz`; } }
  lastF = t;
  if (t - last >= 1000) {
    fps = frames * 1000 / (t - last); frames = 0; last = t;
    $('#fps').textContent = Math.round(fps) + ' fps';
    const target = DET.hz ? Math.min(60, DET.hz) : 60;
    if (S.effects === 'auto' && !autoLite && performance.now() > 4000 && !document.hidden) {
      if (fps < target * 0.75) low++; else low = Math.max(0, low - 1);
      if (low >= 3) { autoLite = true; liteReason = 'frame rate dropped'; applySettings(); toast('Effects reduced to keep things smooth', 'gauge'); }
    }
    const p = $('#v-perfnow'); if (p) p.textContent = perfStatus();
  }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { last = performance.now(); frames = 0; lastF = 0; });

/* =====================================================================
   BOOT
   ===================================================================== */
let bootMs = 0;
applySettings();
setWallpaper(S.wallpaper);
tick();
renderHome();
SCREENS.home.el.classList.add('active'); SCREENS.home.el.removeAttribute('inert'); root.classList.add('on-home');
ensureFocus();
try { const back = sessionStorage.getItem('lumora.return'); sessionStorage.removeItem('lumora.return'); const t = back && $(`#home-stack [data-app="${CSS.escape(back)}"]`); if (t) { setFocus(t); toast(`Back from ${APPS[back].name}`, 'home'); } } catch (e) {}
if (EMBEDDED) toast('Preview mode — open index.html in Chrome, Edge or on your TV so apps open inside Lumora', 'info');
if (F.cur && F.cur.dataset.app) { glowFor(F.cur.dataset.app, true); shelfInfo(F.cur.dataset.app, true); }
bootMs = Math.round(performance.now());
requestAnimationFrame(frame);
bumpIdle();
setInterval(() => { if (!(curScreen === 'game' && G.run) && !isAmbient()) ensureFocus(); }, 800);
window.__lumora = {ask: t => asHandle(t), understand: t => understand(t), S, F, get screen() { return curScreen; }, layers, ST, SET, BR, VC, get bootMs() { return bootMs; }};
})();
</script>
