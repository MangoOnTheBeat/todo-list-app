name: Lumora Android TV app

on:
  push:
    paths: ['lumora-tv/**', '.github/workflows/lumora-android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumora-tv/tv/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lumora-tv-apk
          path: lumora-tv/tv/android/app/build/outputs/apk/debug/app-debug.apk
