<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kaido Drift</title>
<meta name="theme-color" content="#0c0d16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0d16; color: #f6f3ee; font-family: "Titillium Web", system-ui, sans-serif; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gui { position: fixed; inset: 0; pointer-events: none; }
  #gui input { font: inherit; color: inherit; }
  #gui input::placeholder { color: var(--ph, #b3b0c4); }
  .rbx-scroll { scrollbar-width: thin; scrollbar-color: var(--sbc, #b3b0c4) transparent; overscroll-behavior: contain; touch-action: pan-y; }
  .rbx-scroll::-webkit-scrollbar { width: var(--sb, 3px); }
  .rbx-scroll::-webkit-scrollbar-thumb { background: var(--sbc, #b3b0c4); border-radius: 3px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="gui"></div>
<script type="module" src="src/index.js"></script>
</body>
</html>
